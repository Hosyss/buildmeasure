<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" role="img" aria-labelledby="title desc">
  <title id="title">Subtract door and window areas from the wall face</title>
  <desc id="desc">A six by two point seven meter wall has a one by two point one meter door and a one point two meter square window. Net area is twelve point six six square meters.</desc>
  <rect width="640" height="410" rx="20" fill="#f3f7f4"/>
  <g font-family="Arial, sans-serif" font-size="24" fill="#17332c">
    <text x="320" y="40" text-anchor="middle" font-weight="700">Wall face: 6 × 2.7 = 16.20 m²</text>
    <rect x="75" y="85" width="480" height="216" fill="#d6e9dc" stroke="#17332c" stroke-width="2"/>
    <rect x="130" y="133" width="80" height="168" fill="#fff" stroke="#17332c" stroke-width="2"/>
    <rect x="360" y="120" width="96" height="96" fill="#fff" stroke="#17332c" stroke-width="2"/>
    <text x="170" y="335" text-anchor="middle">1 × 2.1 m door</text><text x="410" y="255" text-anchor="middle">1.2 × 1.2 m</text>
    <text x="320" y="385" text-anchor="middle" font-weight="700">Net: 16.20 − 2.10 − 1.44 = 12.66 m²</text>
  </g>
</svg>
