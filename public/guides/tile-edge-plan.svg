<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" role="img" aria-labelledby="title desc">
  <title id="title">Edge cuts on a three point seven by two point six meter floor</title>
  <desc id="desc">A schematic grid of sixty centimeter tiles shows six complete columns and four complete rows, plus narrow cut strips at the right and bottom edges. Grout joints and offcut reuse are omitted. The grid is not a cutting or purchase plan.</desc>
  <rect width="640" height="430" rx="20" fill="#f3f7f4"/>
  <g font-family="Arial, sans-serif" font-size="24" fill="#17332c">
    <text x="320" y="40" text-anchor="middle" font-weight="700">Check the edges before ordering</text>
    <rect x="110" y="95" width="370" height="260" fill="#d6e9dc"/>
    <path d="M470 95H480V355H110V335H470Z" fill="#e7c785"/>
    <g fill="none" stroke="#17332c" stroke-width="2">
      <rect x="110" y="95" width="370" height="260"/>
      <path d="M170 95V355M230 95V355M290 95V355M350 95V355M410 95V355M470 95V355M110 155H480M110 215H480M110 275H480M110 335H480"/>
    </g>
    <text x="295" y="80" text-anchor="middle">3.7 m</text>
    <text x="75" y="225" text-anchor="middle" transform="rotate(-90 75 225)">2.6 m</text>
    <text x="295" y="190" text-anchor="middle" font-weight="700">600 × 600 mm tiles</text>
    <text x="320" y="400" text-anchor="middle">Shaded edges need cuts; reuse needs a plan.</text>
  </g>
</svg>
