<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" role="img" aria-labelledby="title desc">
  <title id="title">Use the exact drywall panel dimensions</title>
  <desc id="desc">A two point four by one point two meter panel covers two point eight eight square meters. It differs physically from a four by eight foot imperial panel.</desc>
  <rect width="640" height="380" rx="20" fill="#f3f7f4"/>
  <g font-family="Arial, sans-serif" font-size="24" fill="#17332c">
    <text x="320" y="42" text-anchor="middle" font-weight="700">Read the supplier&apos;s panel dimensions</text>
    <rect x="80" y="95" width="440" height="220" fill="#d6e9dc" stroke="#17332c" stroke-width="2"/>
    <text x="300" y="80" text-anchor="middle">2.4 m</text><text x="555" y="205" text-anchor="middle" transform="rotate(-90 555 205)">1.2 m</text>
    <text x="300" y="215" text-anchor="middle" font-weight="700">Area: 2.88 m²</text>
    <text x="320" y="355" text-anchor="middle">A 4 × 8 ft preset keeps its own physical size.</text>
  </g>
</svg>
