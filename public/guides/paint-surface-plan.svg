<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
  <title id="title">Keep wall paint and ceiling paint in separate estimates</title>
  <desc id="desc">Four walls unfold into two four meter spans and two three meter spans, each two and a half meters high. Their gross area is thirty-five square meters. A separate four by three meter ceiling covers twelve square meters. Subtract measured openings only from the walls.</desc>
  <rect width="640" height="420" rx="20" fill="#f3f7f4"/>
  <g font-family="Arial, sans-serif" font-size="24" fill="#17332c">
    <text x="320" y="42" text-anchor="middle" font-weight="700">Measure walls and ceiling separately</text>
    <g stroke="#17332c" stroke-width="2" fill="#d6e9dc">
      <rect x="40" y="85" width="160" height="100"/><rect x="200" y="85" width="120" height="100"/>
      <rect x="320" y="85" width="160" height="100"/><rect x="480" y="85" width="120" height="100"/>
      <path d="M85 185V125H115V185" fill="#fff"/>
      <rect x="350" y="115" width="45" height="35" fill="#fff"/>
      <rect x="40" y="265" width="160" height="100" fill="#f1dfb4"/>
    </g>
    <text x="120" y="75" text-anchor="middle">4 m</text><text x="260" y="75" text-anchor="middle">3 m</text>
    <text x="400" y="75" text-anchor="middle">4 m</text><text x="540" y="75" text-anchor="middle">3 m</text>
    <text x="320" y="220" text-anchor="middle">Walls: 14 m perimeter × 2.5 m high</text>
    <text x="120" y="320" text-anchor="middle">Ceiling</text>
    <text x="245" y="295">4 × 3 = 12 m²</text>
    <text x="245" y="335">Use its own product,</text>
    <text x="245" y="368">coverage and coat count.</text>
  </g>
</svg>
