name: Fix PR47 Brick purchase unit

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.ref == 'feature/project-shopping-list'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/project-shopping-list
          fetch-depth: 2
      - name: Fix Brick structured purchase unit
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('app/brick-calculator/brick-calculator.tsx')
          text = path.read_text(encoding='utf-8')
          marker = '  const purchaseCost = usePurchaseCost('
          if text.count(marker) != 1:
              raise SystemExit(f'Expected one Brick purchase-cost marker, found {text.count(marker)}')
          text = text.replace(
              marker,
              '  const purchaseUnitLabel = "brick";\n' + marker,
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git rm .github/workflows/fix-pr47-brick.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/brick-calculator/brick-calculator.tsx
          git diff --cached --check
          git commit -m "Fix Brick structured purchase unit wiring"
          git push origin HEAD:feature/project-shopping-list
