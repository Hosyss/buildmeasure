name: Temporary production evidence updater

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  record:
    if: github.head_ref == 'chore/record-ux-production-verification'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/record-ux-production-verification
          fetch-depth: 0

      - name: Update documentation
        run: python scripts/temporary_record_production_evidence.py

      - name: Commit docs and remove all temporary QA files
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/temporary-production-ux-smoke-v5.yml \
            .github/workflows/temporary-record-production-evidence.yml \
            .github/workflows/temporary-record-production-evidence-v2.yml \
            .github/workflows/temporary-record-production-evidence-v3.yml \
            scripts/temporary_record_production_evidence.py
          git config user.name 'BuildMeasure QA'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Record UX production deployment closure'
          git push origin HEAD:chore/record-ux-production-verification
