name: Fix cutover test expectations

on:
  push:
    branches:
      - chore/cutover-buildtools-workers-subdomain

permissions:
  contents: write

jobs:
  fix-tests:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: chore/cutover-buildtools-workers-subdomain
          fetch-depth: 0

      - name: Update escaped hostname expectations
        shell: bash
        run: |
          set -euo pipefail
          perl -pi -e 's/hosy-sthdr/buildtools/g' tests/rendered-html.test.mjs
          git diff --check

      - name: Commit test expectation fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/rendered-html.test.mjs
          git commit -m "Fix buildtools hostname test expectations"
          git push origin HEAD:chore/cutover-buildtools-workers-subdomain
