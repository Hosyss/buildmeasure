name: Apply post-hole guide discovery links

on:
  push:
    branches:
      - seo/post-hole-bags-guide

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply post-hole guide discovery links'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: seo/post-hole-bags-guide
          fetch-depth: 0

      - name: Apply discovery and test patch
        run: node scripts/apply-post-hole-guide-links.mjs

      - name: Remove temporary patch plumbing and commit
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/apply-post-hole-guide-links.mjs
          rm .github/workflows/apply-post-hole-guide-links.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate post-hole bag guide discovery"
          git push origin HEAD:seo/post-hole-bags-guide
