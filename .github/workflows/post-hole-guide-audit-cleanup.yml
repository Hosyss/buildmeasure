name: Record post-hole guide audit and cleanup

on:
  push:
    branches:
      - seo/post-hole-concrete-guide

permissions:
  contents: write

jobs:
  record-and-clean:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Append verified audit and remove temporary QA plumbing
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          echo '' | base64 -d >> docs/AUDITS.md
          git rm -f \
            .github/workflows/post-hole-guide-milestone-qa.yml \
            .github/workflows/post-hole-guide-audit-cleanup.yml \
            scripts/qa-preview-server.mjs \
            scripts/post-hole-guide-browser-qa.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/AUDITS.md
          git commit -m 'Record post-hole guide milestone QA'
          git push origin HEAD:seo/post-hole-concrete-guide
