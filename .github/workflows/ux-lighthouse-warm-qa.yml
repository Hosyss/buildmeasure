name: Warmed UX Lighthouse QA

on:
  push:
    branches:
      - fix/ux-clarity-and-docs

permissions:
  contents: read

jobs:
  lighthouse:
    if: github.event.head_commit.message == 'Run warmed UX Lighthouse QA'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Start local built application
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --host 127.0.0.1 --port 4173 > /tmp/buildmeasure-start.log 2>&1 &
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              echo 'Local built application is ready.'
              exit 0
            fi
            sleep 1
          done
          cat /tmp/buildmeasure-start.log >&2
          exit 1
      - name: Two explicit non-scored Lighthouse warmups
        shell: bash
        run: |
          set -euo pipefail
          for warmup in 1 2; do
            npx --yes lighthouse@13.4.1 http://127.0.0.1:4173/ \
              --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' \
              --only-categories=performance,accessibility,best-practices,seo \
              --output=json --output-path="/tmp/lighthouse-warmup-${warmup}.json" --quiet
            echo "Completed non-scored warmup ${warmup}."
          done
      - name: Lighthouse affected surfaces only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ux-lighthouse
          for entry in 'home|/' 'brick|/brick-calculator' 'brick-guide|/guides/how-many-bricks-do-i-need'; do
            name="${entry%%|*}"
            path="${entry#*|}"
            url="http://127.0.0.1:4173${path}"
            npx --yes lighthouse@13.4.1 "$url" \
              --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' \
              --only-categories=performance,accessibility,best-practices,seo \
              --output=json --output-path="/tmp/ux-lighthouse/${name}-mobile.json" --quiet
            npx --yes lighthouse@13.4.1 "$url" --preset=desktop \
              --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' \
              --only-categories=performance,accessibility,best-practices,seo \
              --output=json --output-path="/tmp/ux-lighthouse/${name}-desktop.json" --quiet
          done
          node <<'NODE'
          const fs = require('node:fs');
          const dir = '/tmp/ux-lighthouse';
          const files = fs.readdirSync(dir).filter((name) => name.endsWith('.json')).sort();
          let failed = false;
          for (const file of files) {
            const report = JSON.parse(fs.readFileSync(`${dir}/${file}`, 'utf8'));
            const scores = ['performance', 'accessibility', 'best-practices', 'seo']
              .map((key) => Math.round(report.categories[key].score * 100));
            console.log(`${file}: ${scores.join(' / ')}`);
            if (scores.some((score) => score < 95)) failed = true;
          }
          if (failed) process.exit(1);
          NODE
      - name: High-risk production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Upload scored Lighthouse evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-clarity-warmed-lighthouse
          path: |
            /tmp/ux-lighthouse
            /tmp/buildmeasure-start.log
          if-no-files-found: warn
