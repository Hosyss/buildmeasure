name: Bootstrap project shopping list PR v3

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.ref == 'feature/project-shopping-list'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/project-shopping-list
          fetch-depth: 2

      - name: Apply product patch
        run: python3 .github/run-project-shopping-bootstrap.py

      - name: Commit product changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app components docs lib tests README.md
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "Add structured Project Mode shopping lists"
          git push origin HEAD:feature/project-shopping-list
