name: Temporary production read-only audit

on:
  push:
    branches:
      - audit/production-readonly-20260917-temp

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated Playwright
        run: |
          mkdir -p /tmp/buildmeasure-prod-audit
          cd /tmp/buildmeasure-prod-audit
          npm init -y >/dev/null
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Audit production without writes
        run: |
          mkdir -p production-audit-evidence
          cat > /tmp/buildmeasure-prod-audit/audit.mjs <<'EOF'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';

          const base = 'https://buildmeasuretools.pages.dev';
          const origin = new URL(base).origin;
          const expectedAds = fs.readFileSync(path.join(process.env.GITHUB_WORKSPACE, 'public', 'ads.txt'), 'utf8').trim();
          const report = {
            base,
            generatedAt: new Date().toISOString(),
            assets: {},
            publicRoutes: [],
            calculatorsMobile: [],
            arabic: [],
            excludedNoindex: [],
            imageUrls: [],
            blockedProductionWrites: [],
          };

          async function getText(url) {
            const res = await fetch(url, { redirect: 'follow' });
            const text = await res.text();
            assert.equal(res.status, 200, `${url} returned ${res.status}`);
            return { status: res.status, text, finalUrl: res.url };
          }

          const ads = await getText(base + '/ads.txt');
          assert.equal(ads.text.trim(), expectedAds, 'Production ads.txt differs from reviewed source');
          report.assets.adsTxt = { status: ads.status, exactMatch: true, body: ads.text.trim() };

          const robots = await getText(base + '/robots.txt');
          assert.match(robots.text, /Sitemap:\s*https:\/\/buildmeasuretools\.pages\.dev\/sitemap\.xml/i);
          assert.doesNotMatch(robots.text, /adsense-readiness|179b4a8c|pages\.dev\/preview/i);
          report.assets.robotsTxt = { status: robots.status, body: robots.text.trim() };

          const sitemap = await getText(base + '/sitemap.xml');
          const urls = [...sitemap.text.matchAll(/<loc>([^<]+)<\/loc>/g)].map(m => m[1]);
          assert.ok(urls.length >= 10, `Unexpectedly small sitemap: ${urls.length}`);
          for (const url of urls) {
            assert.equal(new URL(url).origin, origin, `Non-production sitemap URL: ${url}`);
          }
          report.assets.sitemap = { status: sitemap.status, urlCount: urls.length };

          const browser = await chromium.launch({ headless: true });
          const imageUrls = new Set();

          async function makeContext(locale, viewport, denyStoredConsent = true) {
            const context = await browser.newContext({ locale, viewport });
            if (denyStoredConsent) {
              await context.addInitScript(() => {
                try { localStorage.setItem('buildmeasure-analytics-consent-v1', 'denied'); } catch {}
              });
            }
            return context;
          }

          async function protectPage(page) {
            await page.route('**/*', async route => {
              const req = route.request();
              const u = new URL(req.url());
              if (u.origin === origin && !['GET', 'HEAD', 'OPTIONS'].includes(req.method())) {
                report.blockedProductionWrites.push({ method: req.method(), url: u.pathname });
                return route.abort();
              }
              if (u.hostname === 'www.clarity.ms' || u.hostname.endsWith('.clarity.ms')) {
                return route.abort();
              }
              return route.continue();
            });
          }

          for (const url of urls) {
            const context = await makeContext('en-US', { width: 1280, height: 900 });
            const page = await context.newPage();
            await protectPage(page);
            const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 30000 });
            assert.ok(response, `No response for ${url}`);
            assert.equal(response.status(), 200, `${url} returned ${response.status()}`);
            await page.waitForTimeout(250);
            const info = await page.evaluate(() => ({
              canonical: document.querySelector('link[rel="canonical"]')?.href || '',
              robots: document.querySelector('meta[name="robots"]')?.getAttribute('content') || '',
              googlebot: document.querySelector('meta[name="googlebot"]')?.getAttribute('content') || '',
              clientWidth: document.documentElement.clientWidth,
              scrollWidth: document.documentElement.scrollWidth,
              images: [...document.images].map(img => img.currentSrc || img.getAttribute('src') || '').filter(Boolean),
            }));
            const expected = new URL(url);
            assert.ok(info.canonical, `Missing canonical on ${url}`);
            const canonical = new URL(info.canonical);
            assert.equal(canonical.origin, origin, `Preview/non-production canonical on ${url}: ${info.canonical}`);
            const norm = p => (p !== '/' ? p.replace(/\/$/, '') : '/');
            assert.equal(norm(canonical.pathname), norm(expected.pathname), `Canonical path mismatch on ${url}`);
            assert.ok(!`${info.robots} ${info.googlebot}`.toLowerCase().includes('noindex'), `Public sitemap route has noindex: ${url}`);
            assert.ok(info.scrollWidth <= info.clientWidth + 1, `Desktop overflow on ${url}`);
            for (const src of info.images) imageUrls.add(new URL(src, url).href);
            report.publicRoutes.push({ url, status: response.status(), canonical: info.canonical, noindex: false, overflowPx: Math.max(0, info.scrollWidth - info.clientWidth), imageCount: info.images.length });
            await context.close();
          }

          const calculators = [
            '/concrete-calculator',
            '/post-hole-concrete-calculator',
            '/paint-calculator',
            '/tile-calculator',
            '/brick-calculator',
            '/gravel-calculator',
            '/mulch-calculator',
            '/drywall-calculator',
          ];

          for (const pathname of calculators) {
            assert.ok(urls.includes(base + pathname), `Calculator missing from sitemap: ${pathname}`);
            const context = await makeContext('en-US', { width: 360, height: 800 });
            const page = await context.newPage();
            await protectPage(page);
            const response = await page.goto(base + pathname, { waitUntil: 'domcontentloaded', timeout: 30000 });
            assert.equal(response?.status(), 200, `${pathname} mobile returned ${response?.status()}`);
            await page.waitForTimeout(400);
            const info = await page.evaluate(() => ({
              clientWidth: document.documentElement.clientWidth,
              scrollWidth: document.documentElement.scrollWidth,
              controls: document.querySelectorAll('input, select, textarea, button').length,
              h1: document.querySelector('h1')?.textContent?.trim() || '',
              images: [...document.images].map(img => img.currentSrc || img.getAttribute('src') || '').filter(Boolean),
            }));
            assert.ok(info.controls > 0, `No calculator controls rendered on ${pathname}`);
            assert.ok(info.h1, `No H1 on ${pathname}`);
            assert.ok(info.scrollWidth <= info.clientWidth + 1, `Mobile overflow on ${pathname}`);
            for (const src of info.images) imageUrls.add(new URL(src, base + pathname).href);
            report.calculatorsMobile.push({ pathname, status: response.status(), controls: info.controls, h1: info.h1, overflowPx: Math.max(0, info.scrollWidth - info.clientWidth), imageCount: info.images.length });
            await context.close();
          }

          for (const viewport of [{ width: 360, height: 800 }, { width: 1280, height: 900 }]) {
            const context = await makeContext('ar-EG', viewport, false);
            const page = await context.newPage();
            let clarityRequests = 0;
            await page.route('https://www.clarity.ms/**', route => { clarityRequests += 1; return route.abort(); });
            await protectPage(page);
            const response = await page.goto(base + '/concrete-calculator', { waitUntil: 'domcontentloaded', timeout: 30000 });
            assert.equal(response?.status(), 200);
            const section = page.locator('section[aria-label="خيارات التحليلات"]');
            await section.waitFor({ state: 'visible', timeout: 5000 });
            const footerButton = page.getByRole('button', { name: 'خيارات التحليلات', exact: true });
            await footerButton.waitFor({ state: 'attached', timeout: 5000 });
            const info = await footerButton.evaluate(el => ({
              text: el.textContent?.trim(),
              dir: el.getAttribute('dir'),
              lang: el.getAttribute('lang'),
              textAlign: getComputedStyle(el).textAlign,
              clientWidth: document.documentElement.clientWidth,
              scrollWidth: document.documentElement.scrollWidth,
            }));
            assert.equal(info.text, 'خيارات التحليلات');
            assert.equal(info.dir, 'rtl');
            assert.equal(info.lang, 'ar');
            assert.equal(info.textAlign, 'right');
            assert.equal(await section.getAttribute('dir'), 'rtl');
            assert.equal(await section.getAttribute('lang'), 'ar');
            assert.ok(info.scrollWidth <= info.clientWidth + 1, `Arabic overflow at ${viewport.width}`);
            assert.equal(clarityRequests, 0, `Clarity loaded before Arabic consent at ${viewport.width}`);
            report.arabic.push({ viewport, status: response.status(), footerText: info.text, dir: info.dir, lang: info.lang, textAlign: info.textAlign, overflowPx: Math.max(0, info.scrollWidth - info.clientWidth), clarityRequestsBeforeConsent: clarityRequests });
            await context.close();
          }

          for (const pathname of ['/feedback', '/projects', '/status']) {
            const context = await makeContext('en-US', { width: 1280, height: 900 });
            const page = await context.newPage();
            await protectPage(page);
            const response = await page.goto(base + pathname, { waitUntil: 'domcontentloaded', timeout: 30000 });
            assert.equal(response?.status(), 200, `${pathname} returned ${response?.status()}`);
            const robotsMeta = await page.locator('meta[name="robots"]').getAttribute('content');
            assert.ok((robotsMeta || '').toLowerCase().includes('noindex'), `${pathname} should remain noindex`);
            report.excludedNoindex.push({ pathname, status: response.status(), robots: robotsMeta });
            await context.close();
          }

          for (const imageUrl of imageUrls) {
            const res = await fetch(imageUrl, { redirect: 'follow' });
            assert.ok(res.status >= 200 && res.status < 400, `Broken image ${imageUrl}: ${res.status}`);
            report.imageUrls.push({ url: imageUrl, status: res.status, contentType: res.headers.get('content-type') || '' });
          }

          await browser.close();
          fs.writeFileSync(path.join(process.env.GITHUB_WORKSPACE, 'production-audit-evidence', 'report.json'), JSON.stringify(report, null, 2));
          console.log(JSON.stringify({
            publicRoutes: report.publicRoutes.length,
            calculatorsMobile: report.calculatorsMobile.length,
            arabicChecks: report.arabic.length,
            excludedNoindex: report.excludedNoindex.length,
            images: report.imageUrls.length,
            blockedProductionWrites: report.blockedProductionWrites.length,
            assets: report.assets,
          }, null, 2));
          EOF
          cd /tmp/buildmeasure-prod-audit
          node audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-readonly-audit-${{ github.sha }}
          path: production-audit-evidence
          retention-days: 7
