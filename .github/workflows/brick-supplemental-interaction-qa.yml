name: Brick supplemental interaction QA

on:
  push:
    branches:
      - feature/brick-calculator

permissions:
  contents: read

jobs:
  supplemental-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build verified production artifact
        run: npm run build

      - name: Add supplemental assertions to temporary browser harness
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/brick-browser-qa.mjs')
          text = path.read_text()
          marker = '  const responsive = {};\n'
          if text.count(marker) != 1:
              raise SystemExit(f'expected one responsive marker, found {text.count(marker)}')

          block = r'''
          // Supplemental release-blocking interaction cases.
          await resetImperial(client);
          current = await state(client);
          assert.match(current.summaries.join(" "), /Allowance adds\s*49 bricks/);

          await switchSystem(client, "Metric");
          current = await state(client);
          assert.match(current.body, /m²/);
          assert.match(current.body, /brick \/ 10 m²/);
          await switchSystem(client, "Imperial");

          await resetImperial(client);
          await selectByLabel(client, "Brick coverage basis", "custom");
          await setInputByLabel(client, "Brick coverage rate", "-1");
          current = await state(client);
          assert.match(current.quantityError, /coverage rate must be greater than zero/i);
          await setInputByLabel(client, "Brick coverage rate", "1e309");
          current = await state(client);
          assert.match(current.quantityError, /coverage rate must be greater than zero|safe numeric range/i);

          await resetImperial(client);
          await setInputByLabel(client, "Doors & windows", "161");
          current = await state(client);
          assert.match(current.quantityError, /smaller than the gross wall area/i);

          await resetImperial(client);
          await setInputByLabel(client, "Waste / breakage", "-1");
          current = await state(client);
          assert.match(current.quantityError, /between 0% and 50%/i);

          await resetImperial(client);
          await setInputByLabel(client, "Wall length", "");
          current = await state(client);
          assert.match(current.quantityError, /wall length must be greater than zero/i);

          await resetImperial(client);
          await setInputByLabel(client, "Wall length", "1e200");
          await setInputByLabel(client, "Wall height", "1e200");
          current = await state(client);
          assert.match(current.quantityError, /safe numeric range/i);

          await resetImperial(client);
          current = await setPrice(client, "0", "$");
          assert.match(current.costSummary, /Estimated material cost\s*\$ 0\.00/);
          assert.equal(current.costError, "");

          await resetImperial(client);
          current = await setPrice(client, "1.25", "EUR");
          assert.match(current.costSummary, /Estimated material cost\s*EUR 1,276\.25/);
          assert.equal(current.costError, "");

          await resetImperial(client);
          current = await setPrice(client, "10", "EGP");
          assert.match(current.costSummary, /Estimated material cost\s*EGP 10,210\.00/);

          await resetImperial(client);
          current = await setPrice(client, "1000000000000000", "EGP");
          assert.match(current.costError, /safe numeric range/i);
          assertOrder(current, 1021);

          await resetImperial(client);
          await setInputByLabel(client, "Optional price per", "1e309");
          current = await state(client);
          assert.equal(current.costSummary, null);
          assert.ok(current.price === "" || /finite number|safe numeric range/i.test(current.costError));
          assertOrder(current, 1021);

          await resetImperial(client);
          await setPrice(client, "10", "EGP");
          await selectByLabel(client, "Brick coverage basis", "custom");
          assert.equal((await state(client)).price, "");
          await setPrice(client, "10", "EGP");
          await setInputByLabel(client, "Brick coverage rate", "700");
          assert.equal((await state(client)).price, "");
          await setPrice(client, "10", "EGP");
          await setInputByLabel(client, "Brick coverage rate", "701");
          assert.equal((await state(client)).price, "");
          const customFocus = await evaluate(
            client,
            `(() => { const input = [...document.querySelectorAll("label")].find((label) => (label.querySelector(":scope > span")?.textContent ?? "").startsWith("Brick coverage rate"))?.querySelector("input"); return { readOnly: input?.readOnly ?? null, tabIndex: input?.tabIndex ?? null }; })()`,
          );
          assert.equal(customFocus.readOnly, false);
          assert.ok(customFocus.tabIndex >= 0);

          await resetImperial(client);
          await setPrice(client, "10", "EGP");
          await evaluate(
            client,
            `Object.defineProperty(navigator, "clipboard", { configurable: true, value: { writeText: async (text) => { window.__brickSupplementalCopied = text; } } }); true`,
          );
          await clickButton(client, "Copy");
          let supplementalCopied = await evaluate(client, `window.__brickSupplementalCopied ?? null`);
          assert.match(supplementalCopied, /1021 bricks to order/);
          assert.match(supplementalCopied, /Net wall area: 144 ft²/);
          assert.match(supplementalCopied, /Brick basis: Modular/);
          assert.match(supplementalCopied, /Coverage rate: 675 brick \/ 100 ft²/);
          assert.match(supplementalCopied, /Waste allowance: 5%/);
          assert.match(supplementalCopied, /Estimated material cost: EGP 10,210\.00/);
          assert.match(supplementalCopied, /Scope: fired-clay brick/);

          await clickButton(client, "Save");
          current = await state(client);
          assert.match(current.history, /Est\. cost EGP 10,210\.00/);
          await setInputByLabel(client, "Waste / breakage", "6");
          current = await state(client);
          assert.match(current.history, /Est\. cost EGP 10,210\.00/);
          await clickButton(client, "Clear all");

          await resetImperial(client);
          await setPrice(client, "-1", "EGP");
          await evaluate(
            client,
            `Object.defineProperty(navigator, "clipboard", { configurable: true, value: { writeText: async (text) => { window.__brickSupplementalInvalidCopied = text; } } }); true`,
          );
          await clickButton(client, "Copy");
          supplementalCopied = await evaluate(client, `window.__brickSupplementalInvalidCopied ?? null`);
          assert.doesNotMatch(supplementalCopied, /Estimated material cost:/);
          await clickButton(client, "Save");
          current = await state(client);
          assert.doesNotMatch(current.history, /Est\. cost/);
          await clickButton(client, "Clear all");
          '''
          path.write_text(text.replace(marker, block + '\n' + marker))
          PY

      - name: Start local production Worker preview
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts
          node scripts/qa-preview-server.mjs > qa-artifacts/preview-server.log 2>&1 &
          echo $! > /tmp/buildmeasure-brick-supplemental-preview.pid
          ready=0
          for _ in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/brick-calculator >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "$ready" != "1" ]]; then
            cat qa-artifacts/preview-server.log
            exit 1
          fi

      - name: Run supplemental Brick interaction matrix
        run: node scripts/brick-browser-qa.mjs

      - name: Stop local preview
        if: always()
        run: |
          if [[ -f /tmp/buildmeasure-brick-supplemental-preview.pid ]]; then
            kill "$(cat /tmp/buildmeasure-brick-supplemental-preview.pid)" >/dev/null 2>&1 || true
          fi

      - name: Upload supplemental evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brick-supplemental-interaction-qa
          path: qa-artifacts
          if-no-files-found: warn
          retention-days: 7
