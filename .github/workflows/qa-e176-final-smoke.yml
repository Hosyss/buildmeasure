name: QA exact final BuildNumbers smoke

on:
  push:
    branches:
      - qa/e176-final-smoke-runner

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PREVIEW_ORIGIN: https://3825aef3.buildnumbers.pages.dev
    steps:
      - name: Verify immutable preview routes and D1 health
        shell: bash
        run: |
          set -euo pipefail
          for path in / /calculators /column-calculator; do
            code="$(curl --silent --show-error --location --output /tmp/body --write-out '%{http_code}' --max-time 15 "${PREVIEW_ORIGIN}${path}")"
            echo "${path} -> HTTP ${code}"
            test "${code}" = "200"
          done

          code="$(curl --silent --show-error --location --output /tmp/health --write-out '%{http_code}' --max-time 15 "${PREVIEW_ORIGIN}/api/health")"
          body="$(cat /tmp/health)"
          echo "/api/health -> HTTP ${code}"
          echo "${body}"
          node -e '
            const code = Number(process.argv[1]);
            const body = JSON.parse(process.argv[2]);
            const ok = code === 200 && body.status === "ok" && body.checks?.feedbackStorage === "ok" && body.checks?.analyticsStorage === "ok";
            if (!ok) process.exit(1);
            console.log("FINAL_EXACT_HEAD_SMOKE_PASS");
          ' "${code}" "${body}"
