name: Temporary production UX smoke

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  production-smoke:
    name: Verify deployed UX on production
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out verification branch
        uses: actions/checkout@v4

      - name: Wait for the merged UX markers to reach Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          base="https://buildmeasure.buildtools.workers.dev"
          ready=0
          for attempt in $(seq 1 30); do
            home="$(curl -fsSL --max-time 20 "$base/" || true)"
            brick="$(curl -fsSL --max-time 20 "$base/brick-calculator" || true)"
            guide="$(curl -fsSL --max-time 20 "$base/guides/how-many-bricks-do-i-need" || true)"
            if grep -Fq 'Example estimate' <<<"$home" \
              && grep -Fq 'brick-rate-output' <<<"$brick" \
              && grep -Fq 'Open Brick Calculator' <<<"$guide"; then
              ready=1
              echo "Merged UX markers are live on production (attempt $attempt)."
              break
            fi
            echo "Production has not exposed all merged UX markers yet (attempt $attempt)."
            sleep 5
          done
          test "$ready" -eq 1

      - name: Verify production HTTP, APIs, links, and responsive browser behavior
        shell: bash
        run: |
          set -euo pipefail
          base="https://buildmeasure.buildtools.workers.dev"
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          echo "Chrome: $chrome"
          "$chrome" --version

          for path in \
            / \
            /brick-calculator \
            /guides/how-many-bricks-do-i-need \
            /api/health \
            /status \
            /robots.txt \
            /sitemap.xml \
            /llms.txt; do
            code="$(curl -sS -o /tmp/production-body -w '%{http_code}' --max-time 25 "$base$path")"
            echo "$path -> HTTP $code"
            test "$code" = "200"
          done

          npm install --no-save --ignore-scripts puppeteer-core@24.16.0

          cat > /tmp/production-smoke.mjs <<'NODE'
          import puppeteer from 'puppeteer-core';

          const base = 'https://buildmeasure.buildtools.workers.dev';
          const executablePath = process.env.CHROME_BIN;
          if (!executablePath) throw new Error('CHROME_BIN is missing');

          const browser = await puppeteer.launch({
            executablePath,
            headless: true,
            args: ['--no-sandbox', '--disable-dev-shm-usage'],
          });

          const failures = [];
          const sameOriginRequestFailures = [];
          const pageErrors = [];

          function check(condition, message) {
            if (!condition) failures.push(message);
          }

          async function verifyPage(route, viewport) {
            const page = await browser.newPage();
            await page.setViewport(viewport);
            page.on('pageerror', (error) => pageErrors.push(`${route} ${viewport.width}px: ${error.message}`));
            page.on('requestfailed', (request) => {
              if (request.url().startsWith(base)) {
                sameOriginRequestFailures.push(`${route} ${viewport.width}px: ${request.url()} :: ${request.failure()?.errorText ?? 'failed'}`);
              }
            });

            const response = await page.goto(`${base}${route}`, { waitUntil: 'domcontentloaded', timeout: 45000 });
            check(response?.status() === 200, `${route} ${viewport.width}px returned ${response?.status()}`);
            await new Promise((resolve) => setTimeout(resolve, 1200));

            const geometry = await page.evaluate(() => ({
              innerWidth: window.innerWidth,
              scrollWidth: document.documentElement.scrollWidth,
            }));
            check(
              geometry.scrollWidth <= geometry.innerWidth + 1,
              `${route} overflows horizontally at ${viewport.width}px: ${geometry.scrollWidth} > ${geometry.innerWidth}`,
            );

            if (route === '/') {
              const home = await page.evaluate(() => {
                const card = document.querySelector('.estimate-card-link');
                return {
                  hasExample: document.body.textContent?.includes('Example estimate') ?? false,
                  headerCta: [...document.querySelectorAll('a')].some((a) => a.textContent?.trim() === 'Browse calculators' && a.getAttribute('href') === '/#calculators'),
                  cardHref: card?.getAttribute('href') ?? null,
                  fakeControls: card?.querySelectorAll('input, select, button').length ?? -1,
                };
              });
              check(home.hasExample, `homepage ${viewport.width}px is missing Example estimate`);
              check(home.headerCta, `homepage ${viewport.width}px is missing Browse calculators CTA`);
              check(home.cardHref === '/concrete-calculator', `homepage example card href is ${home.cardHref}`);
              check(home.fakeControls === 0, `homepage example card contains ${home.fakeControls} fake controls`);
            }

            if (route === '/brick-calculator') {
              const initial = await page.evaluate(() => ({
                output: document.querySelector('#brick-rate-output')?.textContent ?? '',
                customPresent: Boolean(document.querySelector('#brick-custom-coverage-rate')),
                allCalculators: [...document.querySelectorAll('a')].some((a) => a.textContent?.trim() === 'All calculators' && a.getAttribute('href') === '/#calculators'),
              }));
              check(initial.output.includes('bricks / 100 ft²'), `Brick ${viewport.width}px initial preset output is wrong: ${initial.output}`);
              check(!initial.customPresent, `Brick ${viewport.width}px exposes Custom input while preset is selected`);
              check(initial.allCalculators, `Brick ${viewport.width}px is missing All calculators CTA`);

              await page.evaluate(() => {
                const metric = [...document.querySelectorAll('button')].find((button) => button.textContent?.includes('Metric'));
                if (!(metric instanceof HTMLButtonElement)) throw new Error('Metric button not found');
                metric.click();
              });
              await new Promise((resolve) => setTimeout(resolve, 150));
              const metricOutput = await page.$eval('#brick-rate-output', (el) => el.textContent ?? '');
              check(metricOutput.includes('bricks / 10 m²'), `Brick ${viewport.width}px Metric preset output is wrong: ${metricOutput}`);

              await page.evaluate(() => {
                const select = [...document.querySelectorAll('select')].find((item) => [...item.options].some((option) => option.value === 'custom'));
                if (!(select instanceof HTMLSelectElement)) throw new Error('Brick coverage select not found');
                select.value = 'custom';
                select.dispatchEvent(new Event('change', { bubbles: true }));
              });
              await new Promise((resolve) => setTimeout(resolve, 150));
              check(Boolean(await page.$('#brick-custom-coverage-rate')), `Brick ${viewport.width}px Custom input did not appear`);
              check(!(await page.$('#brick-rate-output')), `Brick ${viewport.width}px preset output remained visible in Custom mode`);
            }

            if (route === '/guides/how-many-bricks-do-i-need') {
              const guide = await page.evaluate(() => ({
                headerCta: [...document.querySelectorAll('a')].some((a) => a.textContent?.trim() === 'Open Brick Calculator' && a.getAttribute('href') === '/brick-calculator'),
                primaryCta: [...document.querySelectorAll('a')].some((a) => a.textContent?.trim() === 'Calculate my brick wall' && a.getAttribute('href') === '/brick-calculator'),
              }));
              check(guide.headerCta, `Brick guide ${viewport.width}px is missing header calculator CTA`);
              check(guide.primaryCta, `Brick guide ${viewport.width}px is missing primary calculator CTA`);
            }

            await page.close();
          }

          const routes = ['/', '/brick-calculator', '/guides/how-many-bricks-do-i-need'];
          const viewports = [
            { width: 360, height: 900 },
            { width: 768, height: 1024 },
            { width: 1280, height: 900 },
          ];

          for (const viewport of viewports) {
            for (const route of routes) {
              await verifyPage(route, viewport);
              console.log(`PASS browser ${route} at ${viewport.width}x${viewport.height}`);
            }
          }

          const linkPage = await browser.newPage();
          const internalLinks = new Set();
          for (const route of routes) {
            await linkPage.goto(`${base}${route}`, { waitUntil: 'domcontentloaded', timeout: 45000 });
            const hrefs = await linkPage.$$eval('a[href^="/"]', (anchors) => anchors.map((a) => a.getAttribute('href')).filter(Boolean));
            for (const href of hrefs) internalLinks.add(href.split('#')[0]);
          }
          await linkPage.close();

          for (const href of [...internalLinks].filter(Boolean)) {
            const response = await fetch(`${base}${href}`, { redirect: 'follow' });
            check(response.status >= 200 && response.status < 400, `internal link ${href} returned ${response.status}`);
          }
          console.log(`Checked ${internalLinks.size} unique internal links from the production surfaces.`);

          for (const path of ['/api/health', '/status', '/robots.txt', '/sitemap.xml', '/llms.txt']) {
            const response = await fetch(`${base}${path}`, { redirect: 'follow' });
            check(response.status === 200, `${path} returned ${response.status}`);
          }

          await browser.close();

          for (const item of sameOriginRequestFailures) failures.push(`same-origin request failed: ${item}`);
          for (const item of pageErrors) failures.push(`page error: ${item}`);

          if (failures.length) {
            console.error('\nProduction smoke failures:');
            for (const failure of failures) {
              console.error(`- ${failure}`);
              console.error(`::error title=Production smoke failure::${failure.replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A')}`);
            }
            process.exit(1);
          }

          console.log('Production browser/API/link smoke passed with no horizontal overflow or site page errors.');
          NODE

          CHROME_BIN="$chrome" node /tmp/production-smoke.mjs

      - name: Record smoke summary
        if: success()
        run: |
          {
            echo '## Production UX smoke passed'
            echo '- Merged UX markers visible on Cloudflare production'
            echo '- HTTP 200: homepage, Brick, Brick guide, health/status/robots/sitemap/llms'
            echo '- Browser interaction: 360×900, 768×1024, 1280×900'
            echo '- Brick Imperial/Metric/Custom behavior verified'
            echo '- No horizontal overflow on tested production surfaces'
            echo '- Internal links from tested surfaces resolved successfully'
            echo '- No site page errors or failed same-origin requests observed'
          } >> "$GITHUB_STEP_SUMMARY"
