name: UX stage 1 helper

on:
  push:
    branches:
      - fix/ux-clarity-and-docs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Apply stage
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/apply.py
          python /tmp/apply.py
          git rm .github/workflows/ux-stage1-helper.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/brick-calculator/brick-calculator.tsx app/globals.css tests/brick-rendered.test.mjs
          git commit -m 'Fix Brick coverage preset clarity'
          git push origin HEAD:fix/ux-clarity-and-docs
