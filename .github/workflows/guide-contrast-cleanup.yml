name: Record guide contrast audit and cleanup

on:
  push:
    branches:
      - fix/guide-primary-button-contrast

permissions:
  contents: write

jobs:
  record-and-clean:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Append audit and remove temporary QA plumbing
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          echo '' | base64 -d >> docs/AUDITS.md
          git rm -f \
            .github/workflows/guide-contrast-qa.yml \
            .github/workflows/guide-contrast-cleanup.yml \
            scripts/qa-preview-server.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/AUDITS.md
          git commit -m 'Record guide contrast hotfix QA'
          git push origin HEAD:fix/guide-primary-button-contrast
