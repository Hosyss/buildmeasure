name: UX QA record and cleanup

on:
  push:
    branches:
      - fix/ux-clarity-and-docs

permissions:
  contents: write

jobs:
  record:
    if: github.event.head_commit.message == 'Record UX QA and clean temporary tooling'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Record audit and remove temporary QA tooling
        shell: bash
        run: |
          set -euo pipefail
          python scripts/record-ux-qa.py
          git rm \
            .github/workflows/ux-clarity-qa.yml \
            .github/workflows/ux-lighthouse-warm-qa.yml \
            .github/workflows/ux-lighthouse-gzip-qa.yml \
            .github/workflows/ux-qa-record-cleanup.yml \
            scripts/qa-ux-clarity-browser.mjs \
            scripts/qa-gzip-proxy.mjs \
            scripts/record-ux-qa.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/AUDITS.md docs/PROGRESS.md
          git commit -m 'Record UX clarity QA and clean temporary tooling'
          git push origin HEAD:fix/ux-clarity-and-docs
