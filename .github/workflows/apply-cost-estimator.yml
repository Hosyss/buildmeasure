name: Apply cost estimator integration

on:
  push:
    branches:
      - feature/cost-estimator

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply cost estimator integration'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/cost-estimator
          fetch-depth: 0

      - name: Apply reviewed integration patch
        run: node scripts/apply-cost-estimator-v2.mjs

      - name: Remove temporary patch plumbing and commit
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/apply-cost-estimator.mjs
          rm scripts/apply-cost-estimator-v2.mjs
          rm .github/workflows/apply-cost-estimator.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate optional cost estimates across calculators"
          git push origin HEAD:feature/cost-estimator
