name: PR45 production smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify live Project Mode report deployment
        shell: bash
        run: |
          set -euo pipefail
          PROD='https://buildmeasure.buildtools.workers.dev'
          LEGACY='https://buildmeasure.hosys.chatgpt.site'

          ready=0
          for attempt in $(seq 1 60); do
            body="$(curl -fsS "$PROD/projects" || true)"
            if grep -Fq 'copied, printed, or saved as a PDF' <<<"$body" && grep -Fq 'Print / Save PDF' <<<"$body"; then
              ready=1
              break
            fi
            sleep 10
          done
          test "$ready" -eq 1

          grep -Eqi '<meta[^>]+name="robots"[^>]+content="[^"]*noindex' <<<"$body"

          health="$(curl -fsS "$PROD/api/health")"
          grep -Fq '"status":"ok"' <<<"$health"
          grep -Fq '"version":"0.5.3"' <<<"$health"
          grep -Fq '"feedbackStorage":"ok"' <<<"$health"
          grep -Fq '"analyticsStorage":"ok"' <<<"$health"

          for path in \
            concrete-calculator \
            post-hole-concrete-calculator \
            paint-calculator \
            tile-calculator \
            brick-calculator \
            gravel-calculator \
            mulch-calculator; do
            code="$(curl -fsS -o /dev/null -w '%{http_code}' "$PROD/$path")"
            test "$code" = '200'
          done

          for path in robots.txt sitemap.xml llms.txt; do
            code="$(curl -fsS -o /dev/null -w '%{http_code}' "$PROD/$path")"
            test "$code" = '200'
          done

          sitemap="$(curl -fsS "$PROD/sitemap.xml")"
          ! grep -Fq '<loc>https://buildmeasure.buildtools.workers.dev/projects</loc>' <<<"$sitemap"

          effective="$(curl -fsSL -o /dev/null -w '%{url_effective}' "$LEGACY/projects?qa=pr45")"
          test "$effective" = "$PROD/projects?qa=pr45"

          echo 'PR45_PRODUCTION_SMOKE=PASS'
