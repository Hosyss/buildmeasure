name: Refresh audited production lockfile

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  audit-lockfix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply non-forced production audit lockfile fixes
        run: npm audit fix --package-lock-only --omit=dev --ignore-scripts
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Resolve remaining production dependency advisory"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
