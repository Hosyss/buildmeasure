name: Guide contrast QA

on:
  push:
    branches:
      - fix/guide-primary-button-contrast

permissions:
  contents: read

jobs:
  contrast-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build verified production artifact
        run: npm run build

      - name: Start production Worker preview
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts lighthouse-results
          node scripts/qa-preview-server.mjs > qa-artifacts/preview-server.log 2>&1 &
          echo $! > /tmp/buildmeasure-guide-contrast-preview.pid
          ready=0
          for _ in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/guides/how-many-bags-of-concrete-for-post-holes >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "$ready" != "1" ]]; then
            cat qa-artifacts/preview-server.log
            exit 1
          fi

      - name: Run guide Lighthouse mobile and desktop
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          route='http://127.0.0.1:4173/guides/how-many-bags-of-concrete-for-post-holes'
          echo "Lighthouse $(npx --yes lighthouse --version)" | tee qa-artifacts/lighthouse-version.txt

          for warmup in 1 2; do
            npx --yes lighthouse "$route" \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
              --only-categories=performance \
              --output=json \
              --output-path="/tmp/guide-contrast-warmup-${warmup}.json" \
              --quiet
          done

          npx --yes lighthouse "$route" \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json \
            --output-path=lighthouse-results/guide-mobile.json \
            --quiet

          npx --yes lighthouse "$route" \
            --preset=desktop \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json \
            --output-path=lighthouse-results/guide-desktop.json \
            --quiet

          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          const files = ["guide-mobile.json", "guide-desktop.json"];
          const summary = [];
          for (const file of files) {
            const report = JSON.parse(await readFile(`lighthouse-results/${file}`, "utf8"));
            const scores = Object.fromEntries(
              ["performance", "accessibility", "best-practices", "seo"].map((name) => [
                name,
                Math.round((report.categories[name]?.score ?? 0) * 100),
              ]),
            );
            const contrast = report.audits["color-contrast"];
            summary.push({ file, scores, colorContrastScore: contrast?.score ?? null });
            console.log(`${file}: ${JSON.stringify(scores)}, color-contrast=${contrast?.score}`);
            if (scores.accessibility !== 100) process.exitCode = 1;
            if (contrast?.score !== 1) process.exitCode = 1;
            if (Object.values(scores).some((score) => score < 95)) process.exitCode = 1;
          }
          await writeFile("qa-artifacts/guide-contrast-summary.json", `${JSON.stringify(summary, null, 2)}\n`);
          NODE

      - name: Stop preview
        if: always()
        run: |
          if [[ -f /tmp/buildmeasure-guide-contrast-preview.pid ]]; then
            kill "$(cat /tmp/buildmeasure-guide-contrast-preview.pid)" >/dev/null 2>&1 || true
          fi

      - name: Upload contrast evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guide-contrast-qa
          path: |
            qa-artifacts
            lighthouse-results
          retention-days: 7
