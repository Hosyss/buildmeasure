name: Prepare workers.dev subdomain cutover

on:
  push:
    branches:
      - chore/cutover-buildtools-workers-subdomain

permissions:
  contents: write

jobs:
  replace-origin:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: chore/cutover-buildtools-workers-subdomain
          fetch-depth: 0

      - name: Replace the current workers.dev origin
        shell: bash
        run: |
          set -euo pipefail
          old='buildmeasure.hosy-sthdr.workers.dev'
          new='buildmeasure.buildtools.workers.dev'
          mapfile -t files < <(git grep -Il "$old" -- ':!CHANGELOG.md' ':!docs/AUDITS.md' ':!.github/workflows/prepare-workers-subdomain-cutover.yml' || true)
          if ((${#files[@]} == 0)); then
            echo "No current-origin references found."
            exit 0
          fi
          printf 'Updating %s\n' "${files[@]}"
          perl -pi -e "s/\\Q${old}\\E/${new}/g" "${files[@]}"
          git diff --check

      - name: Commit prepared cutover
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare buildtools workers.dev cutover"
          git push origin HEAD:chore/cutover-buildtools-workers-subdomain
