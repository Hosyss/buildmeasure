name: Apply robust Brick QA harness fixes

on:
  push:
    branches:
      - feature/brick-calculator

permissions:
  contents: write

jobs:
  patch-and-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fix known brittle assertions without changing product code
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/brick-browser-qa.mjs')
          text = path.read_text()
          replacements = [
              ('assert.match(current.resultBreakdown, /Net brick area 144 ft²/);',
               'assert.match(current.resultBreakdown, /Net brick area\\s*144 ft²/);'),
              ('assert.match(current.costSummary, /Estimated material cost EGP 10,210/);',
               'assert.match(current.costSummary, /Estimated material cost\\s*EGP 10,210/);'),
              ('await clickButton(client, "Clear saved estimates");',
               'await clickButton(client, "Clear all");'),
              ('document.querySelector(".calculator-history")?.textContent',
               'document.querySelector(".history-panel")?.textContent'),
              ('for (const expected of ["Imperial", "Metric", "Reset", "Brick coverage basis", "Price per brick", "Copy", "Save", "Print", "Report an issue"]) {',
               'for (const expected of ["Imperial", "Metric", "Reset", "Modular", "Price per brick", "Copy", "Save", "Print", "Report a calculation issue"]) {'),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one occurrence of {old!r}, found {count}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
          git rm -f .github/workflows/brick-qa-harness-fix2-helper.yml
          git rm -f .github/workflows/brick-qa-harness-hardening-helper.yml || true
          git rm -f .brick-qa-retry-trigger-2 || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/brick-browser-qa.mjs
          git commit -m 'Fix temporary Brick browser QA selectors'
          git push origin HEAD:feature/brick-calculator
