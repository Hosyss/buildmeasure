name: Admin control plane security gate

on:
  pull_request:
    paths:
      - 'admin-control-plane/**'
      - '.github/workflows/admin-control-plane-ci.yml'
  push:
    branches:
      - 'security/admin-control-plane-app-auth-*'
    paths:
      - 'admin-control-plane/**'
      - '.github/workflows/admin-control-plane-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: admin-control-plane
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Type-check and security contracts
        run: npm run ci
      - name: High-risk production dependency audit
        run: npm audit --omit=dev --audit-level=high
