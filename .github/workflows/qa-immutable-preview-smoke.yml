name: QA immutable BuildNumbers preview smoke

on:
  push:
    branches:
      - qa/buildnumbers-preview-smoke-e8288bc

permissions:
  contents: read

jobs:
  immutable-preview-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare D1 health across candidate and existing origins
        shell: bash
        run: |
          set -u
          for origin in \
            "https://bcf298ce.buildnumbers.pages.dev" \
            "https://buildnumbers.pages.dev" \
            "https://buildmeasuretools.pages.dev" \
            "https://buildmeasure.buildtools.workers.dev"
          do
            file="$(mktemp)"
            code="$(curl --silent --show-error --location --output "${file}" --write-out '%{http_code}' --max-time 30 "${origin}/api/health" || true)"
            echo "HEALTH_ORIGIN=${origin}"
            echo "HEALTH_HTTP=${code}"
            printf 'HEALTH_BODY=%s\n' "$(cat "${file}")"
          done

      - name: Compare a known-valid analytics POST
        shell: bash
        run: |
          set -u
          payload='{"event":"calculator_opened","calculator":"concrete-calculator","route":"/concrete-calculator","sessionToken":"00000000-0000-4000-8000-000000000001","source":"direct","medium":"","campaign":"","referrerHost":"","browser":"chrome","device":"mobile","locale":"en-US","detail":""}'
          for origin in \
            "https://bcf298ce.buildnumbers.pages.dev" \
            "https://daf9bf12.buildmeasuretools.pages.dev" \
            "https://buildnumbers.pages.dev" \
            "https://buildmeasuretools.pages.dev" \
            "https://buildmeasure.buildtools.workers.dev"
          do
            file="$(mktemp)"
            code="$(curl --silent --show-error --location --request POST \
              --header 'Content-Type: application/json' \
              --data "${payload}" \
              --output "${file}" --write-out '%{http_code}' --max-time 30 \
              "${origin}/api/analytics" || true)"
            echo "ANALYTICS_ORIGIN=${origin}"
            echo "ANALYTICS_HTTP=${code}"
            printf 'ANALYTICS_BODY=%s\n' "$(cat "${file}")"
          done

      - name: Report Cloudflare control-plane credential availability
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [[ -n "${CLOUDFLARE_API_TOKEN:-}" && -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "CLOUDFLARE_CONTROL_PLANE=AVAILABLE"
          else
            echo "CLOUDFLARE_CONTROL_PLANE=UNAVAILABLE"
          fi
