name: QA immutable BuildNumbers preview smoke

on:
  push:
    branches:
      - qa/buildnumbers-preview-smoke-e8288bc

permissions:
  contents: read

jobs:
  immutable-preview-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PREVIEW_ORIGIN: https://bcf298ce.buildnumbers.pages.dev
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Verify immutable preview routes
        shell: bash
        run: |
          set -euo pipefail
          for path in / /calculators /robots.txt /sitemap.xml; do
            code="$(curl --silent --show-error --location --output /tmp/body --write-out '%{http_code}' --max-time 30 "${PREVIEW_ORIGIN}${path}")"
            echo "${path} -> HTTP ${code}"
            test "${code}" = "200"
          done

      - name: Verify D1-backed health endpoint
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --fail-with-body --silent --show-error --location --max-time 30 "${PREVIEW_ORIGIN}/api/health")"
          printf '%s\n' "${body}"
          node -e '
            const body = JSON.parse(process.argv[1]);
            const ok = body.status === "ok" &&
              body.checks?.feedbackStorage === "ok" &&
              body.checks?.analyticsStorage === "ok";
            if (!ok) {
              console.error("D1-backed health gate failed", body);
              process.exit(1);
            }
            console.log("D1-backed health gate passed.");
          ' "${body}"

      - name: Verify Cloudflare Pages DB binding identity when credentials are available
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "BINDING_IDENTITY=UNVERIFIED"
            echo "Cloudflare API credentials are not exposed to this GitHub Actions job; project binding identity cannot be independently read here."
            exit 0
          fi

          project_json="$(curl --fail-with-body --silent --show-error --location --max-time 30 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/buildnumbers")"
          db_json="$(curl --fail-with-body --silent --show-error --location --max-time 30 --get \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --data-urlencode "name=buildmeasure-production" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database")"

          node -e '
            const project = JSON.parse(process.argv[1]);
            const dbs = JSON.parse(process.argv[2]);
            if (!project.success || !dbs.success) {
              console.error("Cloudflare API did not return success.");
              process.exit(1);
            }
            const matches = (dbs.result || []).filter((db) => db.name === "buildmeasure-production");
            if (matches.length !== 1 || !matches[0].uuid) {
              console.error("Expected exactly one buildmeasure-production D1 database.");
              process.exit(1);
            }
            const expected = matches[0].uuid;
            const preview = project.result?.deployment_configs?.preview?.d1_databases?.DB?.id;
            const production = project.result?.deployment_configs?.production?.d1_databases?.DB?.id;
            console.log(`Expected DB UUID: ${expected}`);
            console.log(`Preview DB binding UUID: ${preview || "missing"}`);
            console.log(`Production DB binding UUID: ${production || "missing"}`);
            if (preview !== expected || production !== expected) {
              console.error("Cloudflare DB binding identity gate failed.");
              process.exit(1);
            }
            console.log("BINDING_IDENTITY=VERIFIED");
          ' "${project_json}" "${db_json}"
