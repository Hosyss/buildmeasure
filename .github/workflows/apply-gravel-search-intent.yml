name: Apply gravel search intent update

on:
  push:
    branches:
      - seo/gravel-search-intent

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: seo/gravel-search-intent
          fetch-depth: 0

      - name: Update gravel calculator and guide search intent
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          calc_path = Path('app/gravel-calculator/page.tsx')
          calc = calc_path.read_text()
          calc = calc.replace('Gravel Calculator — Volume, Tons & Bags', 'Gravel Calculator — Cubic Yards, Tons & Bags')
          calc = calc.replace(
              'Calculate gravel volume, estimated weight, short tons, metric tonnes, and complete bags for a rectangular area with adjustable depth, density, and allowance.',
              'Calculate gravel for driveways, paths, and base layers in cubic yards, estimated tons, metric tonnes, and bags with adjustable depth, density, and allowance.'
          )
          calc = calc.replace(
              'Estimate gravel volume and weight with transparent density and allowance assumptions.',
              'Estimate gravel for driveways and paths in cubic yards, tons, and bags with transparent density and allowance assumptions.'
          )
          calc = calc.replace(
              'A rectangular coverage calculator for gravel volume, estimated mass, tons, and complete bags.',
              'A gravel calculator for driveways, paths, and base layers with cubic yards, estimated mass, tons, and complete bags.'
          )
          calc = calc.replace(
              'Estimate rectangular gravel coverage, volume, weight,\n                  tons, and bags without hiding the density assumption.',
              'Estimate gravel for driveways, paths, and base layers in cubic yards,\n                  weight, tons, and bags without hiding the density assumption.'
          )
          calc_path.write_text(calc)

          guide_path = Path('app/guides/how-much-gravel-do-i-need/page.tsx')
          guide = guide_path.read_text()
          guide = guide.replace('title: "How Much Gravel Do I Need?",', 'title: "How Much Gravel Do I Need for a Driveway?",', 1)
          guide = guide.replace(
              '"Calculate gravel volume, cubic yards, estimated tons, and bags from rectangular area, depth, allowance, and a verified bulk density.",',
              '"Calculate how much gravel a driveway needs in cubic yards, estimated tons, and bags from area, installed depth, allowance, and verified bulk density.",'
          )
          guide = guide.replace('title: "How Much Gravel Do I Need?",', 'title: "How Much Gravel Do I Need for a Driveway?", 1)
          guide = guide.replace(
              '"A transparent gravel volume and weight formula with density and compaction checks.",',
              '"A driveway gravel quantity guide with cubic yards, estimated tons, bags, density, and compaction checks.",'
          )
          guide = guide.replace('headline: "How Much Gravel Do I Need?",', 'headline: "How Much Gravel Do I Need for a Driveway?",')
          guide = guide.replace(
              '"A transparent method for converting rectangular area and depth into gravel volume, estimated mass, tons, and bags.",',
              '"A transparent method for converting driveway area and installed depth into gravel volume, estimated mass, tons, and bags.",'
          )
          guide = guide.replace('dateModified: "2026-08-11",', 'dateModified: "2026-08-13",')
          guide = guide.replace('name: "How Much Gravel Do I Need?", item:', 'name: "How Much Gravel Do I Need for a Driveway?", item:')
          guide = guide.replace('<h1>How much gravel do I need?</h1>', '<h1>How much gravel do I need for a driveway?</h1>')
          guide = guide.replace(
              'Calculate geometric volume first, then use a verified material\n              density only when the order must be converted to weight or bags.',
              'Measure the driveway area and installed gravel depth first, then convert\n              that volume to cubic yards, estimated tons, or bags with a verified density.'
          )
          guide = guide.replace(
              '<h2>Measure cubic volume before estimating weight</h2>\n              <p>\n                Multiply area by the installed depth after converting all\n                dimensions to one unit.',
              '<h2>Driveway gravel starts with area × installed depth</h2>\n              <p>\n                For a rectangular driveway, multiply length by width by the installed\n                gravel depth after converting all dimensions to one unit.'
          )
          guide = guide.replace(
              '<h2>A 10 ft × 10 ft layer, 4 inches deep</h2>\n              <p>Use 10% allowance, 93 lb/ft³ example density, and 50 lb bags.</p>\n              <ol className="guide-calculation-steps">\n                <li>Net volume: 10 × 10 × (4 ÷ 12) = 33.333 ft³.</li>\n                <li>Net cubic yards: 33.333 ÷ 27 = 1.235 yd³.</li>\n                <li>Order volume: 33.333 × 1.10 = 36.667 ft³ = 1.358 yd³.</li>\n                <li>Estimated mass: 36.667 × 93 = 3,410 lb.</li>\n                <li>Short tons: 3,410 ÷ 2,000 = 1.705 tons.</li>\n                <li>Complete bags: round up (3,410 ÷ 50) = 69 bags.</li>\n              </ol>',
              '<h2>A 12 ft × 50 ft driveway area, 4 inches deep</h2>\n              <p>Use 10% allowance, 93 lb/ft³ example density, and 50 lb bags. The 4 in depth is an arithmetic example, not a universal driveway specification.</p>\n              <ol className="guide-calculation-steps">\n                <li>Net volume: 12 × 50 × (4 ÷ 12) = 200 ft³.</li>\n                <li>Net cubic yards: 200 ÷ 27 = 7.407 yd³.</li>\n                <li>Order volume: 200 × 1.10 = 220 ft³ = 8.148 yd³.</li>\n                <li>Estimated mass: 220 × 93 = 20,460 lb.</li>\n                <li>Short tons: 20,460 ÷ 2,000 = 10.23 tons.</li>\n                <li>Complete bags: round up (20,460 ÷ 50) = 410 bags.</li>\n              </ol>'
          )
          guide_path.write_text(guide)

          for path in (calc_path, guide_path):
              text = path.read_text()
              if 'hosy-sthdr' in text:
                  raise SystemExit(f'old hostname unexpectedly present in {path}')
          PY
          git diff --check

      - name: Commit gravel search-intent update
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/gravel-calculator/page.tsx app/guides/how-much-gravel-do-i-need/page.tsx
          git commit -m "Target gravel driveway search intent"
          git push origin HEAD:seo/gravel-search-intent
