name: Guide density correction helper

on:
  push:
    branches:
      - fix/ux-clarity-and-docs

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run guide density correction'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Apply guide density correction
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ux-guide-density-stage.py
          git rm scripts/ux-guide-density-stage.py .github/workflows/ux-guide-density-helper.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/globals.css app/guides/how-many-bricks-do-i-need/page.tsx
          git commit -m 'Bring guide quick answer CTA into view'
          git push origin HEAD:fix/ux-clarity-and-docs
