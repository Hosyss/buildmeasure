name: QA live BuildNumbers browser smoke

on:
  push:
    branches:
      - qa/buildnumbers-preview-smoke-e8288bc

permissions:
  contents: read

jobs:
  live-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PREVIEW_ORIGIN: https://bcf298ce.buildnumbers.pages.dev
    steps:
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install focused browser harness
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium

      - name: Diagnose candidate at 360px
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { chromium } from "playwright";

          const origin = process.env.PREVIEW_ORIGIN;
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 360, height: 800 } });

          for (const route of ["/column-calculator", "/concrete-calculator"]) {
            const page = await context.newPage();
            const badResponses = [];
            const failedRequests = [];
            page.on("response", (response) => {
              if (response.status() >= 400) {
                badResponses.push({
                  status: response.status(),
                  method: response.request().method(),
                  url: response.url(),
                  resourceType: response.request().resourceType(),
                });
              }
            });
            page.on("requestfailed", (request) => {
              failedRequests.push({
                method: request.method(),
                url: request.url(),
                resourceType: request.resourceType(),
                failure: request.failure()?.errorText || "unknown",
              });
            });

            const response = await page.goto(`${origin}${route}`, { waitUntil: "domcontentloaded", timeout: 15000 });
            await page.waitForTimeout(1000);
            const diagnostics = await page.evaluate(() => {
              const viewport = window.innerWidth;
              const offenders = [...document.querySelectorAll("body *")]
                .map((element) => {
                  const rect = element.getBoundingClientRect();
                  const style = getComputedStyle(element);
                  return {
                    tag: element.tagName.toLowerCase(),
                    id: element.id,
                    className: typeof element.className === "string" ? element.className : "",
                    text: (element.textContent || "").replace(/\s+/g, " ").trim().slice(0, 160),
                    left: Math.round(rect.left * 100) / 100,
                    right: Math.round(rect.right * 100) / 100,
                    width: Math.round(rect.width * 100) / 100,
                    minWidth: style.minWidth,
                    maxWidth: style.maxWidth,
                    whiteSpace: style.whiteSpace,
                    overflowX: style.overflowX,
                    display: style.display,
                    gridTemplateColumns: style.gridTemplateColumns,
                  };
                })
                .filter((item) => item.right > viewport + 1 || item.left < -1 || item.width > viewport + 1)
                .slice(0, 40);
              return {
                viewport,
                htmlScrollWidth: document.documentElement.scrollWidth,
                bodyScrollWidth: document.body.scrollWidth,
                offenders,
              };
            });

            console.log(`ROUTE=${route}`);
            console.log(`HTTP=${response?.status() ?? 0}`);
            console.log(`LAYOUT=${JSON.stringify(diagnostics)}`);
            console.log(`BAD_RESPONSES=${JSON.stringify(badResponses)}`);
            console.log(`FAILED_REQUESTS=${JSON.stringify(failedRequests)}`);
            await page.close();
          }

          await context.close();
          await browser.close();
          NODE
