name: QA live BuildNumbers browser smoke

on:
  push:
    branches:
      - qa/buildnumbers-preview-smoke-e8288bc

permissions:
  contents: read

jobs:
  live-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PREVIEW_ORIGIN: https://bcf298ce.buildnumbers.pages.dev
    steps:
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install focused browser harness
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium

      - name: Confirm candidate regressions at 360px
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { chromium } from "playwright";

          const origin = process.env.PREVIEW_ORIGIN;
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 360, height: 800 } });
          const page = await context.newPage();
          const analytics = [];

          page.on("response", async (response) => {
            if (response.url().endsWith("/api/analytics")) {
              const request = response.request();
              let responseText = "";
              try { responseText = await response.text(); } catch {}
              analytics.push({
                status: response.status(),
                method: request.method(),
                postData: request.postData(),
                responseText,
              });
            }
          });

          await page.goto(`${origin}/column-calculator`, { waitUntil: "domcontentloaded", timeout: 15000 });
          await page.waitForTimeout(1200);

          const cssExperiment = await page.evaluate(() => {
            const measure = () => ({
              html: document.documentElement.scrollWidth,
              body: document.body.scrollWidth,
              panel: Math.round((document.querySelector(".calculator-panel")?.getBoundingClientRect().width || 0) * 100) / 100,
              toggles: [...document.querySelectorAll(".unit-toggle")].map((el) => ({
                width: Math.round(el.getBoundingClientRect().width * 100) / 100,
                minWidth: getComputedStyle(el).minWidth,
              })),
            });

            const baseline = measure();
            const style = document.createElement("style");
            style.textContent = ".unit-toggle{min-width:0!important}.calculator-panel{min-width:0!important}";
            document.head.append(style);
            const afterFix = measure();
            return { baseline, afterFix };
          });

          console.log(`CSS_EXPERIMENT=${JSON.stringify(cssExperiment)}`);
          console.log(`ANALYTICS=${JSON.stringify(analytics)}`);
          await page.close();
          await context.close();
          await browser.close();
          NODE
