name: QA live BuildNumbers browser smoke

on:
  push:
    branches:
      - qa/buildnumbers-preview-smoke-e8288bc

permissions:
  contents: read

jobs:
  live-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PREVIEW_ORIGIN: https://bcf298ce.buildnumbers.pages.dev
    steps:
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install focused browser harness
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium

      - name: Capture analytics and verify mobile CSS candidate
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { chromium } from "playwright";

          const origin = process.env.PREVIEW_ORIGIN;
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 360, height: 800 } });
          const page = await context.newPage();
          const analyticsRequests = [];
          const analyticsResponses = [];

          page.on("request", (request) => {
            if (request.url().endsWith("/api/analytics")) {
              analyticsRequests.push({
                method: request.method(),
                postData: request.postData(),
                headers: request.headers(),
              });
            }
          });
          page.on("response", (response) => {
            if (!response.url().endsWith("/api/analytics")) return;
            response.text().then((body) => {
              analyticsResponses.push({ status: response.status(), body });
            }).catch(() => {
              analyticsResponses.push({ status: response.status(), body: "<unreadable>" });
            });
          });

          await page.goto(`${origin}/column-calculator`, { waitUntil: "domcontentloaded", timeout: 15000 });
          await page.waitForTimeout(2500);

          const css = await page.evaluate(() => {
            const measure = () => ({
              html: document.documentElement.scrollWidth,
              body: document.body.scrollWidth,
              panel: Math.round((document.querySelector(".calculator-panel")?.getBoundingClientRect().width || 0) * 100) / 100,
            });
            const baseline = measure();
            const style = document.createElement("style");
            style.textContent = `
              .calculator-panel { min-width: 0 !important; }
              .unit-toggle {
                min-width: 0 !important;
                grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
              }
              .unit-toggle button {
                min-width: 0 !important;
                flex-direction: column !important;
                gap: 2px !important;
                text-align: center !important;
              }
            `;
            document.head.append(style);
            const afterFix = measure();
            return { baseline, afterFix };
          });

          console.log(`ANALYTICS_REQUESTS=${JSON.stringify(analyticsRequests)}`);
          console.log(`ANALYTICS_RESPONSES=${JSON.stringify(analyticsResponses)}`);
          console.log(`CSS_FINAL_EXPERIMENT=${JSON.stringify(css)}`);

          await page.close();
          await context.close();
          await browser.close();
          NODE
