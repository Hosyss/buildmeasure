name: Temporary analytics choices locale audit

on:
  push:
    branches:
      - audit/analytics-choices-20260917-temp

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install isolated Playwright
        run: |
          mkdir -p /tmp/buildmeasure-choices-pw
          cd /tmp/buildmeasure-choices-pw
          npm init -y >/dev/null
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Start local production preview
        run: |
          mkdir -p choices-evidence
          npm start -- --port 4173 --hostname 127.0.0.1 > choices-evidence/server.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/concrete-calculator >/dev/null; then exit 0; fi
            sleep 1
          done
          cat choices-evidence/server.log
          exit 1
      - name: Verify EN/AR mobile and desktop footer control
        run: |
          cat > /tmp/buildmeasure-choices-pw/audit.mjs <<'EOF'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';

          const base = 'http://127.0.0.1:4173';
          const browser = await chromium.launch({ headless: true });
          const results = [];
          const variants = [
            { locale: 'en-US', lang: 'en', width: 360, height: 800, label: 'Analytics choices', align: 'left' },
            { locale: 'ar-EG', lang: 'ar', width: 360, height: 800, label: 'خيارات التحليلات', align: 'right' },
            { locale: 'en-US', lang: 'en', width: 1280, height: 900, label: 'Analytics choices', align: 'left' },
            { locale: 'ar-EG', lang: 'ar', width: 1280, height: 900, label: 'خيارات التحليلات', align: 'right' },
          ];

          for (const variant of variants) {
            const context = await browser.newContext({ locale: variant.locale, viewport: { width: variant.width, height: variant.height } });
            await context.addInitScript(() => localStorage.setItem('buildmeasure-analytics-consent-v1', 'denied'));
            const page = await context.newPage();
            let clarityRequests = 0;
            await page.route('https://www.clarity.ms/**', route => { clarityRequests += 1; return route.abort(); });
            await page.goto(base + '/concrete-calculator', { waitUntil: 'domcontentloaded' });
            const button = page.getByRole('button', { name: variant.label, exact: true });
            await button.waitFor();
            const details = await button.evaluate(el => ({
              text: el.textContent?.trim(),
              dir: el.getAttribute('dir'),
              lang: el.getAttribute('lang'),
              textAlign: getComputedStyle(el).textAlign,
              clientWidth: document.documentElement.clientWidth,
              scrollWidth: document.documentElement.scrollWidth,
            }));
            assert.equal(details.text, variant.label);
            assert.equal(details.dir, variant.lang === 'ar' ? 'rtl' : 'ltr');
            assert.equal(details.lang, variant.lang);
            assert.equal(details.textAlign, variant.align);
            assert.ok(details.scrollWidth <= details.clientWidth + 1, 'horizontal overflow');
            assert.equal(clarityRequests, 0, 'Clarity loaded before consent');

            await button.click();
            const panel = page.locator('section[aria-label]');
            await panel.waitFor();
            assert.equal(await panel.getAttribute('aria-label'), variant.label);
            assert.equal(await panel.getAttribute('dir'), variant.lang === 'ar' ? 'rtl' : 'ltr');
            assert.equal(clarityRequests, 0, 'opening choices loaded Clarity');
            results.push({ ...variant, ...details, clarityRequests });
            await context.close();
          }

          fs.writeFileSync(path.join(process.env.GITHUB_WORKSPACE, 'choices-evidence', 'report.json'), JSON.stringify(results, null, 2));
          await browser.close();
          EOF
          cd /tmp/buildmeasure-choices-pw
          node audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analytics-choices-locale-${{ github.sha }}
          path: choices-evidence
          retention-days: 7
