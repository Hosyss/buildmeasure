name: Bootstrap project shopping list PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'feature/project-shopping-list'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2

      - name: Run embedded bootstrap patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import subprocess
          import textwrap

          workflow = Path('.github/workflows/bootstrap-project-shopping.yml').read_text(encoding='utf-8')
          start_marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY\n\n          git diff --check"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          Path('/tmp/project-shopping-bootstrap.py').write_text(script, encoding='utf-8')
          subprocess.run(['python3', '/tmp/project-shopping-bootstrap.py'], check=True)
          PY

          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app components docs lib tests README.md
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "Add structured Project Mode shopping lists"
          git push origin HEAD:feature/project-shopping-list
