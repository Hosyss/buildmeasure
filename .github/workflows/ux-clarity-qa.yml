name: UX clarity pre-PR QA

on:
  push:
    branches:
      - fix/ux-clarity-and-docs

permissions:
  contents: read

jobs:
  qa:
    if: github.event.head_commit.message == 'Run UX clarity QA'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: TypeScript semantic check for changed TS/TSX surfaces
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import ts from 'typescript';
          import { execFileSync } from 'node:child_process';
          import { existsSync, readFileSync } from 'node:fs';

          const base = 'fdac762aee542ab4ceb9482910b6e8e54b9a4e96';
          const changed = execFileSync('git', ['diff', '--name-only', `${base}...HEAD`], { encoding: 'utf8' })
            .trim()
            .split(/\r?\n/)
            .filter(Boolean)
            .filter((file) => /\.(?:ts|tsx)$/.test(file) && existsSync(file));

          if (changed.length === 0) throw new Error('No changed TypeScript surfaces were found.');

          const configFile = ts.readConfigFile('tsconfig.json', (path) => readFileSync(path, 'utf8'));
          if (configFile.error) {
            console.error(ts.flattenDiagnosticMessageText(configFile.error.messageText, '\n'));
            process.exit(1);
          }
          const parsed = ts.parseJsonConfigFileContent(configFile.config, ts.sys, process.cwd());
          const options = {
            ...parsed.options,
            noEmit: true,
            incremental: false,
            allowImportingTsExtensions: true,
          };
          const program = ts.createProgram({ rootNames: changed, options });
          const diagnostics = [];
          for (const file of changed) {
            const source = program.getSourceFile(file);
            if (!source) {
              diagnostics.push({ file: undefined, messageText: `TypeScript did not load changed file ${file}`, category: ts.DiagnosticCategory.Error, code: 0 });
              continue;
            }
            diagnostics.push(...program.getSyntacticDiagnostics(source));
            diagnostics.push(...program.getSemanticDiagnostics(source));
          }

          if (diagnostics.length) {
            console.error(ts.formatDiagnosticsWithColorAndContext(diagnostics, {
              getCanonicalFileName: (file) => file,
              getCurrentDirectory: () => process.cwd(),
              getNewLine: () => '\n',
            }));
            process.exit(1);
          }
          console.log(`Changed-surface semantic TypeScript check passed for ${changed.length} files:`);
          for (const file of changed) console.log(`- ${file}`);
          NODE
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Rendered tests
        run: node --test tests/*rendered*.test.mjs
      - name: Reject remaining read-only form affordances in app surfaces
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'readOnly|aria-readonly' app components; then
            echo 'Unexpected read-only form affordance remains in app/components.' >&2
            exit 1
          fi
          echo 'No readOnly or aria-readonly controls remain in app/components.'
      - name: Start local built application
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --host 127.0.0.1 --port 4173 > /tmp/buildmeasure-start.log 2>&1 &
          echo $! > /tmp/buildmeasure-start.pid
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              echo 'Local built application is ready.'
              exit 0
            fi
            sleep 1
          done
          cat /tmp/buildmeasure-start.log >&2
          exit 1
      - name: Launch isolated Chrome
        shell: bash
        run: |
          set -euo pipefail
          google-chrome --headless=new --no-sandbox --disable-dev-shm-usage \
            --remote-debugging-port=9222 --remote-allow-origins='*' \
            --user-data-dir=/tmp/buildmeasure-ux-chrome about:blank \
            > /tmp/chrome.log 2>&1 &
          echo $! > /tmp/chrome.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:9222/json/version >/dev/null; then
              echo 'Chrome DevTools endpoint is ready.'
              exit 0
            fi
            sleep 1
          done
          cat /tmp/chrome.log >&2
          exit 1
      - name: Browser interaction and visual QA
        env:
          QA_ORIGIN: http://127.0.0.1:4173
          CDP_ORIGIN: http://127.0.0.1:9222
          QA_SCREENSHOT_DIR: /tmp/ux-qa
        run: node scripts/qa-ux-clarity-browser.mjs
      - name: Lighthouse affected surfaces only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ux-lighthouse
          for entry in 'home|/' 'brick|/brick-calculator' 'brick-guide|/guides/how-many-bricks-do-i-need'; do
            name="${entry%%|*}"
            path="${entry#*|}"
            url="http://127.0.0.1:4173${path}"
            npx --yes lighthouse@13.4.1 "$url" \
              --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' \
              --only-categories=performance,accessibility,best-practices,seo \
              --output=json --output-path="/tmp/ux-lighthouse/${name}-mobile.json" --quiet
            npx --yes lighthouse@13.4.1 "$url" --preset=desktop \
              --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' \
              --only-categories=performance,accessibility,best-practices,seo \
              --output=json --output-path="/tmp/ux-lighthouse/${name}-desktop.json" --quiet
          done
          node <<'NODE'
          const fs = require('node:fs');
          const dir = '/tmp/ux-lighthouse';
          const files = fs.readdirSync(dir).filter((name) => name.endsWith('.json')).sort();
          let failed = false;
          for (const file of files) {
            const report = JSON.parse(fs.readFileSync(`${dir}/${file}`, 'utf8'));
            const scores = ['performance', 'accessibility', 'best-practices', 'seo']
              .map((key) => Math.round(report.categories[key].score * 100));
            console.log(`${file}: ${scores.join(' / ')}`);
            if (scores.some((score) => score < 95)) failed = true;
          }
          if (failed) process.exit(1);
          NODE
      - name: High-risk production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Upload UX QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-clarity-pre-pr-qa
          path: |
            /tmp/ux-qa
            /tmp/ux-lighthouse
            /tmp/buildmeasure-start.log
            /tmp/chrome.log
          if-no-files-found: warn
