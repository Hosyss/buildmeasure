name: IndexNow one-time submission

on:
  push:
    branches:
      - ops/indexnow-concrete-2026-08-12

permissions:
  contents: read

jobs:
  submit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ops/indexnow-concrete-2026-08-12
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Submit production sitemap URLs once
        run: node scripts/submit-indexnow.mjs
