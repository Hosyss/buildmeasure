name: Integrate Brick wall guide discovery

on:
  push:
    branches:
      - seo/brick-wall-guide

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Link the Brick guide and remove this helper
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_str, old, new):
              path = Path(path_str)
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path_str}: expected one marker, found {count}')
              path.write_text(text.replace(old, new, 1))

          replace_once(
              'app/brick-calculator/page.tsx',
              '''          <a className="next-card next-card-live" href="/guides/material-estimating-basics">
            <span>Guide</span>
            <strong>Material Estimating Basics</strong>
            <small>Geometry, allowances &amp; product data</small>
          </a>''',
              '''          <a className="next-card next-card-live" href="/guides/how-many-bricks-do-i-need">
            <span>Guide</span>
            <strong>How Many Bricks Do I Need?</strong>
            <small>Net wall area, openings &amp; waste</small>
          </a>''',
          )

          home_marker = '''            <a href="/guides/how-many-tiles-do-i-need">
              <span>Tile guide</span>
              <h3>How many tiles do I need?</h3>
              <p>Convert room and tile dimensions into complete boxes with an explicit waste allowance.</p>
              <strong>Plan the tile order <ArrowIcon /></strong>
            </a>'''
          home_add = home_marker + '''
            <a href="/guides/how-many-bricks-do-i-need">
              <span>Brick guide</span>
              <h3>How many bricks do I need for a wall?</h3>
              <p>Subtract measured openings, apply documented fired-clay brick coverage, and keep waste explicit.</p>
              <strong>Plan the brick order <ArrowIcon /></strong>
            </a>'''
          replace_once('app/page.tsx', home_marker, home_add)

          sitemap_marker = '''    {
      url: absoluteUrl("/guides/how-many-tiles-do-i-need"),
      lastModified: new Date("2026-08-11"),
      changeFrequency: "monthly",
      priority: 0.8,
    },'''
          sitemap_add = sitemap_marker + '''
    {
      url: absoluteUrl("/guides/how-many-bricks-do-i-need"),
      lastModified: new Date("2026-08-13"),
      changeFrequency: "monthly",
      priority: 0.8,
    },'''
          replace_once('app/sitemap.ts', sitemap_marker, sitemap_add)

          llms_marker = '- [How Many Tiles Do I Need?](https://buildmeasure.buildtools.workers.dev/guides/how-many-tiles-do-i-need)'
          llms_add = llms_marker + '\n- [How Many Bricks Do I Need for a Wall?](https://buildmeasure.buildtools.workers.dev/guides/how-many-bricks-do-i-need)'
          replace_once('public/llms.txt', llms_marker, llms_add)

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text()
          marker = '### Added\n\n'
          entry = '- Added a reference-backed “How Many Bricks Do I Need for a Wall?” guide with BIA coverage-rate examples, openings subtraction, waste sequencing, explicit bond/material scope boundaries, and direct Brick Calculator linking.\n'
          if entry not in changelog:
              if marker not in changelog:
                  raise SystemExit('CHANGELOG Added marker not found')
              changelog = changelog.replace(marker, marker + entry, 1)
          changelog_path.write_text(changelog)
          PY

          git rm -f .github/workflows/brick-guide-integration-helper.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/brick-calculator/page.tsx app/page.tsx app/sitemap.ts public/llms.txt CHANGELOG.md
          git commit -m 'Integrate Brick wall guide discovery'
          git push origin HEAD:seo/brick-wall-guide
