name: Record Brick guide QA and clean release branch

on:
  push:
    branches:
      - seo/brick-wall-guide

permissions:
  contents: write

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Append audit evidence and remove temporary QA files
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          python -c "import base64,gzip;from pathlib import Path;p=Path('docs/AUDITS.md');t=p.read_text();h='## 2026-08-13 — Brick wall long-tail guide milestone audit';a=gzip.decompress(base64.b64decode('')).decode();p.write_text(t if h in t else t+a)"
          git rm -f .github/workflows/brick-guide-milestone-qa.yml scripts/brick-guide-browser-qa.mjs scripts/qa-preview-server.mjs .github/workflows/brick-guide-closeout-helper.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/AUDITS.md
          git commit -m 'Record Brick guide milestone QA and clean branch'
          git push origin HEAD:seo/brick-wall-guide
