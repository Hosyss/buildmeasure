name: UX stage 2 helper

on:
  push:
    branches:
      - fix/ux-clarity-and-docs

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run UX stage 2 helper'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Apply shared UX clarity stage
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ux-stage2.py
          git rm scripts/ux-stage2.py .github/workflows/ux-stage2-helper.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/site-header.tsx app/page.tsx app/globals.css app/*-calculator/page.tsx app/guides/*/page.tsx tests/ux-clarity-rendered.test.mjs
          git commit -m 'Clarify shared navigation examples and guide typography'
          git push origin HEAD:fix/ux-clarity-and-docs
