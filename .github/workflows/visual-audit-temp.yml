name: Temporary preview visual audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build production artifact
        run: npm run build
      - name: Install browser audit dependency without changing manifests
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local production preview
        run: |
          mkdir -p audit-evidence/screenshots
          npm start -- --port 4173 --hostname 127.0.0.1 > audit-evidence/server.log 2>&1 &
          echo $! > /tmp/buildmeasure-preview.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat audit-evidence/server.log
          exit 1
      - name: Audit public routes at mobile tablet and desktop widths
        run: |
          cat > /tmp/visual-audit.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';

          const base = 'http://127.0.0.1:4173';
          const routes = [
            '/',
            '/concrete-calculator',
            '/post-hole-concrete-calculator',
            '/paint-calculator',
            '/tile-calculator',
            '/brick-calculator',
            '/gravel-calculator',
            '/mulch-calculator',
            '/drywall-calculator',
            '/guides',
            '/guides/material-estimating-basics',
            '/guides/how-many-bags-of-concrete',
            '/guides/how-many-bags-of-concrete-for-post-holes',
            '/guides/how-much-paint-do-i-need',
            '/guides/how-many-tiles-do-i-need',
            '/guides/how-many-bricks-do-i-need',
            '/guides/how-much-gravel-do-i-need',
            '/guides/how-much-mulch-do-i-need',
            '/guides/how-many-drywall-sheets-do-i-need',
            '/methodology',
            '/about',
            '/contact',
            '/privacy',
            '/terms',
            '/projects',
            '/feedback',
            '/status',
            '/__audit_missing_page__'
          ];
          const viewports = [
            { label: 'mobile-360', width: 360, height: 800 },
            { label: 'tablet-768', width: 768, height: 900 },
            { label: 'desktop-1280', width: 1280, height: 900 },
          ];
          const slug = (route) => route === '/' ? 'home' : route.replace(/^\//, '').replaceAll('/', '__').replace(/[^a-z0-9_-]/gi, '_');
          const browser = await chromium.launch({ headless: true });
          const report = { generatedAt: new Date().toISOString(), base, routes: [], endpoints: {}, redirect: null };

          for (const viewport of viewports) {
            const context = await browser.newContext({ viewport: { width: viewport.width, height: viewport.height } });
            for (const route of routes) {
              const page = await context.newPage();
              const consoleErrors = [];
              const pageErrors = [];
              page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });
              page.on('pageerror', err => pageErrors.push(String(err)));
              let status = null;
              let navError = null;
              try {
                const response = await page.goto(base + route, { waitUntil: 'domcontentloaded', timeout: 30000 });
                status = response?.status() ?? null;
                await page.waitForTimeout(600);
              } catch (error) {
                navError = String(error);
              }
              const dom = await page.evaluate(() => {
                const imgs = [...document.images];
                const canonical = document.querySelector('link[rel="canonical"]')?.getAttribute('href') ?? null;
                const robots = document.querySelector('meta[name="robots"]')?.getAttribute('content') ?? null;
                const h1 = [...document.querySelectorAll('h1')].map(n => n.textContent?.trim() ?? '').filter(Boolean);
                const bodyText = document.body?.innerText?.trim() ?? '';
                return {
                  title: document.title,
                  canonical,
                  robots,
                  h1,
                  bodyTextLength: bodyText.length,
                  clientWidth: document.documentElement.clientWidth,
                  scrollWidth: document.documentElement.scrollWidth,
                  horizontalOverflowPx: Math.max(0, document.documentElement.scrollWidth - document.documentElement.clientWidth),
                  brokenImages: imgs.filter(img => img.complete && img.naturalWidth === 0).map(img => img.currentSrc || img.src),
                  forms: document.forms.length,
                  inputs: document.querySelectorAll('input, select, textarea').length,
                  buttons: document.querySelectorAll('button').length,
                  internalLinks: [...document.querySelectorAll('a[href^="/"]')].map(a => a.getAttribute('href')).filter(Boolean).length,
                };
              }).catch(() => ({ title: '', canonical: null, robots: null, h1: [], bodyTextLength: 0, clientWidth: viewport.width, scrollWidth: viewport.width, horizontalOverflowPx: 0, brokenImages: [], forms: 0, inputs: 0, buttons: 0, internalLinks: 0 }));
              const dir = path.join('audit-evidence', 'screenshots', viewport.label);
              fs.mkdirSync(dir, { recursive: true });
              await page.screenshot({ path: path.join(dir, slug(route) + '.jpg'), type: 'jpeg', quality: 68, fullPage: true }).catch(() => {});
              report.routes.push({ viewport: viewport.label, route, status, navError, consoleErrors, pageErrors, ...dom });
              await page.close();
            }
            await context.close();
          }

          const api = await browser.newContext();
          for (const endpoint of ['/robots.txt', '/sitemap.xml', '/llms.txt', '/api/health', '/ads.txt', '/google6d67c58ff3b5201c.html']) {
            try {
              const response = await api.request.get(base + endpoint, { failOnStatusCode: false });
              report.endpoints[endpoint] = { status: response.status(), contentType: response.headers()['content-type'] ?? null, text: (await response.text()).slice(0, 12000) };
            } catch (error) {
              report.endpoints[endpoint] = { error: String(error) };
            }
          }
          try {
            const response = await api.request.get('https://buildmeasure.hosys.chatgpt.site/guides/material-estimating-basics?audit=1', { maxRedirects: 0, failOnStatusCode: false });
            report.redirect = { status: response.status(), location: response.headers()['location'] ?? null };
          } catch (error) {
            report.redirect = { error: String(error) };
          }
          await api.close();
          await browser.close();
          fs.writeFileSync('audit-evidence/visual-audit.json', JSON.stringify(report, null, 2));

          const failures = report.routes.filter(r => r.navError || r.pageErrors.length || r.horizontalOverflowPx > 1 || r.brokenImages.length || (r.route === '/__audit_missing_page__' ? r.status !== 404 : r.status !== 200));
          fs.writeFileSync('audit-evidence/summary.txt', [
            `Audited route/view combinations: ${report.routes.length}`,
            `Failures requiring review: ${failures.length}`,
            ...failures.map(f => `${f.viewport} ${f.route}: status=${f.status} overflow=${f.horizontalOverflowPx} brokenImages=${f.brokenImages.length} pageErrors=${f.pageErrors.length} navError=${f.navError ?? ''}`)
          ].join('\n'));
          if (failures.some(f => f.navError || f.pageErrors.length || f.horizontalOverflowPx > 1 || f.brokenImages.length || (f.route === '/__audit_missing_page__' ? f.status !== 404 : f.status !== 200))) {
            process.exitCode = 1;
          }
          EOF
          node /tmp/visual-audit.mjs
      - name: Upload visual audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildmeasure-visual-audit-${{ github.sha }}
          path: audit-evidence
          retention-days: 7
