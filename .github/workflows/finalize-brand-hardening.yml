name: Finalize brand hardening evidence

on:
  push:
    branches:
      - hardening/production-brand-identity

permissions:
  contents: write

concurrency:
  group: finalize-brand-hardening
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.head_commit.message == 'Finalize brand hardening audit evidence'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: hardening/production-brand-identity
          fetch-depth: 0

      - name: Append audit evidence and remove temporary QA plumbing
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main

          cat >> docs/AUDITS.md <<'EOF'

