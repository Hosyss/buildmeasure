name: Post-merge Project Mode verification

on:
  push:
    branches: [qa/post-merge-project-mode]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-main-tree:
    name: Verify merged main tree
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out merged tree
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run complete quality gate
        run: npm run qa:automated
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  production-smoke:
    name: Production smoke after merge
    needs: verify-main-tree
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for Project Mode to reach production
        shell: bash
        run: |
          set -euo pipefail
          base="https://buildmeasure.buildtools.workers.dev"
          ready=0
          for attempt in $(seq 1 60); do
            body="$(curl -fsS --max-time 15 "$base/projects" || true)"
            if grep -q "Group estimates into one project" <<<"$body"; then
              ready=1
              echo "Project Mode is live on attempt $attempt."
              break
            fi
            sleep 5
          done
          if [ "$ready" -ne 1 ]; then
            echo "Project Mode did not appear on production within 5 minutes."
            exit 1
          fi

      - name: Check public routes and health
        shell: bash
        run: |
          set -euo pipefail
          base="https://buildmeasure.buildtools.workers.dev"
          routes=(
            "/"
            "/projects"
            "/concrete-calculator"
            "/post-hole-concrete-calculator"
            "/paint-calculator"
            "/tile-calculator"
            "/gravel-calculator"
            "/mulch-calculator"
            "/brick-calculator"
            "/privacy"
            "/robots.txt"
            "/sitemap.xml"
            "/llms.txt"
          )
          for route in "${routes[@]}"; do
            code="$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 20 "$base$route")"
            if [ "$code" != "200" ]; then
              echo "$route returned HTTP $code"
              cat /tmp/body || true
              exit 1
            fi
            echo "PASS $route -> 200"
          done

          health="$(curl -fsS --max-time 20 "$base/api/health")"
          HEALTH="$health" node -e '
            const data = JSON.parse(process.env.HEALTH);
            if (data.status !== "ok") throw new Error(`health status: ${data.status}`);
            if (data.checks?.feedbackStorage !== "ok") throw new Error("feedback storage is not ok");
            if (data.checks?.analyticsStorage !== "ok") throw new Error("analytics storage is not ok");
            console.log(`PASS /api/health -> ${data.status}, version ${data.version}`);
          '

      - name: Check Project Mode privacy and indexing boundaries
        shell: bash
        run: |
          set -euo pipefail
          base="https://buildmeasure.buildtools.workers.dev"
          projects="$(curl -fsS --max-time 20 "$base/projects")"
          sitemap="$(curl -fsS --max-time 20 "$base/sitemap.xml")"
          grep -q "noindex" <<<"$projects"
          grep -q 'data-clarity-mask="true"' <<<"$projects"
          if grep -q "/projects" <<<"$sitemap"; then
            echo "Project Mode must not be present in sitemap.xml"
            exit 1
          fi
          echo "PASS Project Mode noindex + Clarity mask + sitemap exclusion"

      - name: Check legacy redirect preserves path and query
        shell: bash
        run: |
          set -euo pipefail
          legacy="https://buildmeasure.hosys.chatgpt.site/projects?utm_source=post-merge-qa"
          expected="https://buildmeasure.buildtools.workers.dev/projects?utm_source=post-merge-qa"
          curl -sS --max-time 20 -o /dev/null -D /tmp/legacy.headers --max-redirs 0 "$legacy"
          status="$(awk 'NR==1 {print $2}' /tmp/legacy.headers)"
          location="$(awk 'tolower($1)=="location:" {gsub("\r", "", $2); print $2; exit}' /tmp/legacy.headers)"
          case "$status" in
            301|302|307|308) ;;
            *) echo "Unexpected legacy redirect status: $status"; cat /tmp/legacy.headers; exit 1 ;;
          esac
          if [ "$location" != "$expected" ]; then
            echo "Legacy redirect target mismatch: $location"
            cat /tmp/legacy.headers
            exit 1
          fi
          echo "PASS legacy redirect -> $location"
