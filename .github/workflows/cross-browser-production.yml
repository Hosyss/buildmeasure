name: Temporary Firefox and WebKit production QA

on:
  pull_request:
    paths:
      - "playwright.production.config.mjs"
      - "tests/production-cross-browser.spec.mjs"
      - ".github/workflows/cross-browser-production.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buildmeasure-cross-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-browser:
    name: Firefox and WebKit production matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out QA harness
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked project dependencies
        run: npm ci

      - name: Install temporary Playwright runner
        run: npm install --no-save --no-package-lock @playwright/test@1.55.0

      - name: Install Firefox and WebKit
        run: npx playwright install --with-deps firefox webkit

      - name: Run real-engine production matrix
        run: npx playwright test --config=playwright.production.config.mjs

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-browser-production-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
