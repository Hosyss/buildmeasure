name: Temporary production AdSense smoke

on:
  push:
    branches: [maintenance/adsense-readiness-2026-08-22]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for merged production and verify public site
        shell: bash
        run: |
          cat > /tmp/prod-smoke.mjs <<'EOF'
          import assert from "node:assert/strict";

          const base = "https://buildmeasure.buildtools.workers.dev";
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function get(path, options = {}) {
            const response = await fetch(`${base}${path}`, options);
            const text = await response.text();
            return { response, text };
          }

          let deployed = false;
          for (let attempt = 1; attempt <= 60; attempt += 1) {
            try {
              const { response, text } = await get("/contact", { cache: "no-store" });
              if (response.status === 200 && text.includes("Get in touch with BuildMeasure")) {
                deployed = true;
                console.log(`Production update visible after attempt ${attempt}.`);
                break;
              }
            } catch (error) {
              console.log(`Waiting for production (${attempt}/60): ${error.message}`);
            }
            await sleep(10_000);
          }
          assert.equal(deployed, true, "Merged AdSense readiness release never became visible on Production");

          const substantiveRoutes = [
            "/",
            "/concrete-calculator",
            "/post-hole-concrete-calculator",
            "/paint-calculator",
            "/tile-calculator",
            "/brick-calculator",
            "/gravel-calculator",
            "/mulch-calculator",
            "/guides/material-estimating-basics",
            "/guides/how-many-bags-of-concrete",
            "/guides/how-many-bags-of-concrete-for-post-holes",
            "/guides/how-much-paint-do-i-need",
            "/guides/how-many-tiles-do-i-need",
            "/guides/how-many-bricks-do-i-need",
            "/guides/how-much-gravel-do-i-need",
            "/guides/how-much-mulch-do-i-need",
            "/methodology",
            "/about",
            "/contact",
            "/privacy",
            "/terms",
          ];

          const htmlByRoute = new Map();
          for (const route of substantiveRoutes) {
            const { response, text } = await get(route, { cache: "no-store" });
            assert.equal(response.status, 200, `${route} must return 200`);
            assert.match(response.headers.get("content-type") ?? "", /text\/html/i, `${route} must be HTML`);
            assert.equal(new URL(response.url).origin, base, `${route} must stay on canonical production origin`);
            assert.ok(text.length > 500, `${route} unexpectedly thin/empty`);
            htmlByRoute.set(route, text);
          }

          const home = htmlByRoute.get("/");
          assert.match(home, /Material estimates you can build on\./);
          assert.match(home, /name="google-adsense-account" content="ca-pub-3369551572403499"/);
          assert.doesNotMatch(home, /pagead2\.googlesyndication\.com\/pagead\/js\/adsbygoogle\.js/);
          assert.match(home, /href="\/contact"/);
          assert.match(home, /href="\/privacy"/);
          assert.match(home, /href="\/terms"/);

          const contact = htmlByRoute.get("/contact");
          assert.match(contact, /Get in touch with BuildMeasure/);
          assert.match(contact, /Calculator accuracy or usability/);
          assert.match(contact, /Privacy or data request/);
          assert.match(contact, /rel="canonical" href="https:\/\/buildmeasure\.buildtools\.workers\.dev\/contact"/);

          const privacy = htmlByRoute.get("/privacy");
          assert.match(privacy, /Last updated August 22, 2026/);
          assert.match(privacy, /structured local/);
          assert.match(privacy, /shopping lists/);
          assert.match(privacy, /Advertising and Google AdSense/);
          assert.match(privacy, /Google Ads Settings/);
          assert.match(privacy, /Google-certified consent management platform/);

          for (const route of ["/projects", "/feedback", "/status"]) {
            const { response, text } = await get(route, { cache: "no-store" });
            assert.equal(response.status, 200, `${route} must remain reachable`);
            assert.match(text, /<meta[^>]+name="robots"[^>]+content="[^"]*noindex/i, `${route} must remain noindex`);
          }

          const ads = await get("/ads.txt", { cache: "no-store" });
          assert.equal(ads.response.status, 200, "ads.txt must return 200");
          assert.equal(ads.text.trim(), "google.com, pub-3369551572403499, DIRECT, f08c47fec0942fa0");

          const sitemap = await get("/sitemap.xml", { cache: "no-store" });
          assert.equal(sitemap.response.status, 200, "sitemap.xml must return 200");
          for (const route of substantiveRoutes) {
            const expected = route === "/" ? `${base}/` : `${base}${route}`;
            assert.ok(sitemap.text.includes(expected), `sitemap missing ${route}`);
          }
          for (const route of ["/projects", "/feedback", "/status", "/analytics", "/feedback/inbox"]) {
            assert.ok(!sitemap.text.includes(`${base}${route}`), `sitemap must exclude ${route}`);
          }

          const robots = await get("/robots.txt", { cache: "no-store" });
          assert.equal(robots.response.status, 200, "robots.txt must return 200");
          assert.match(robots.text, /User-agent:/i);
          assert.match(robots.text, /Sitemap:\s*https:\/\/buildmeasure\.buildtools\.workers\.dev\/sitemap\.xml/i);

          const health = await get("/api/health", { cache: "no-store" });
          assert.equal(health.response.status, 200, "health endpoint must return 200");
          const healthJson = JSON.parse(health.text);
          assert.equal(healthJson.status, "ok");

          const hrefs = new Set();
          for (const html of htmlByRoute.values()) {
            for (const match of html.matchAll(/href="(\/[^"]*)"/g)) {
              const url = new URL(match[1], base);
              if (url.origin === base) hrefs.add(`${url.pathname}${url.search}`);
            }
          }
          for (const href of [...hrefs].sort()) {
            const response = await fetch(`${base}${href}`, { redirect: "manual", cache: "no-store" });
            assert.ok(response.status >= 200 && response.status < 400, `Broken internal link ${href}: ${response.status}`);
          }

          const legacyUrl = "https://buildmeasure.hosys.chatgpt.site/guides/how-many-bricks-do-i-need?qa=1";
          const legacy = await fetch(legacyUrl, { redirect: "manual", cache: "no-store" });
          assert.ok([301, 302, 307, 308].includes(legacy.status), `Legacy host must redirect, got ${legacy.status}`);
          const location = legacy.headers.get("location");
          assert.equal(location, `${base}/guides/how-many-bricks-do-i-need?qa=1`, "Legacy redirect must preserve path/query");

          console.log(`PASS: ${substantiveRoutes.length} substantive pages, ${hrefs.size} internal links, AdSense surfaces, utility noindex, health, and legacy redirect verified.`);
          EOF
          node /tmp/prod-smoke.mjs
