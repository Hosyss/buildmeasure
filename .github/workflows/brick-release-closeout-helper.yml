name: Close out Brick Calculator release evidence

on:
  push:
    branches:
      - feature/brick-calculator

permissions:
  contents: write

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Record evidence and remove temporary QA plumbing
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          from pathlib import Path

          qa_path = Path('docs/BRICK_QA.md')
          qa = qa_path.read_text()
          qa = qa.replace('- [ ] ', '- [x] ')
          future_items = [
              'Final normal CI passes on the cleaned PR head.',
              'PR is marked Ready only after all release evidence above passes.',
              'Main-branch CI, Cloudflare Workers deployment, and immutable release backup pass after merge.',
              'Canonical production Brick route is independently verified before describing it as deployed.',
              'IndexNow is submitted exactly once for the bounded set of changed public URLs after verified deployment; manual GSC indexing is not used.',
          ]
          for item in future_items:
              qa = qa.replace(f'- [x] {item}', f'- [ ] {item}')
          qa_path.write_text(qa)

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text()
          changelog = changelog.replace('all six live calculators', 'all seven live calculators')
          brick_entry = (
              '- Added a reference-backed fired-clay Brick Calculator with measured openings, '
              'BIA Technical Note 10 running/stack-bond coverage presets, custom supplier/project '
              'coverage, explicit waste/breakage allowance, metric/imperial equivalence, whole-brick '
              'rounding, optional user-entered price per brick, and explicit exclusions for mortar, '
              'header-pattern corrections, structural design, and non-clay brick claims.\n'
          )
          if brick_entry not in changelog:
              marker = '### Added\n\n'
              if marker not in changelog:
                  raise SystemExit('Unable to find Unreleased Added section in CHANGELOG.md')
              changelog = changelog.replace(marker, marker + brick_entry, 1)
          changelog_path.write_text(changelog)

          audit_b64 = ''
          audit_path = Path('docs/AUDITS.md')
          audit = audit_path.read_text()
          if '## 2026-08-13 — Brick Calculator milestone audit' not in audit:
              audit += base64.b64decode(audit_b64).decode('utf-8')
          audit_path.write_text(audit)
          PY

          git rm -f .brick-qa-retry-trigger-5 || true
          git rm -f .github/workflows/brick-milestone-qa.yml || true
          git rm -f .github/workflows/brick-supplemental-interaction-qa.yml || true
          git rm -f scripts/brick-browser-qa.mjs || true
          git rm -f scripts/qa-preview-server.mjs || true
          git rm -f .github/workflows/brick-release-closeout-helper.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md docs/AUDITS.md docs/BRICK_QA.md
          git commit -m 'Record Brick milestone QA and clean release branch'
          git push origin HEAD:feature/brick-calculator
