name: Bootstrap project shopping list

on:
  push:
    branches: [feature/project-shopping-list]
    paths:
      - .github/workflows/bootstrap-project-shopping.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Apply structured shopping-list slice
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          history = '''import {
            MAX_CURRENCY_LABEL_LENGTH,
            type PurchaseCostResult,
          } from "./cost-estimate.ts";

          export const MAX_PURCHASE_UNIT_LABEL_LENGTH = 80;

          export type SavedEstimatePurchase = {
            quantity: number;
            unitLabel: string;
            unitPrice?: number;
            total?: number;
            currencyLabel?: string;
          };

          export type SavedEstimate = {
            id: number;
            label: string;
            summary: string;
            purchase?: SavedEstimatePurchase;
          };

          function validSingleLineLabel(value: unknown, maxLength: number) {
            return (
              typeof value === "string" &&
              value.trim().length > 0 &&
              value.trim().length <= maxLength &&
              !/[\\r\\n\\t]/.test(value)
            );
          }

          export function isSavedEstimatePurchase(
            value: unknown,
          ): value is SavedEstimatePurchase {
            if (typeof value !== "object" || value === null) return false;

            const candidate = value as SavedEstimatePurchase;
            if (
              !Number.isSafeInteger(candidate.quantity) ||
              candidate.quantity < 0 ||
              !validSingleLineLabel(candidate.unitLabel, MAX_PURCHASE_UNIT_LABEL_LENGTH)
            ) {
              return false;
            }

            const hasUnitPrice = candidate.unitPrice !== undefined;
            const hasTotal = candidate.total !== undefined;
            const hasCurrency = candidate.currencyLabel !== undefined;
            const hasAnyCost = hasUnitPrice || hasTotal || hasCurrency;

            if (!hasAnyCost) return true;
            if (!(hasUnitPrice && hasTotal && hasCurrency)) return false;

            return (
              typeof candidate.unitPrice === "number" &&
              Number.isFinite(candidate.unitPrice) &&
              candidate.unitPrice >= 0 &&
              typeof candidate.total === "number" &&
              Number.isFinite(candidate.total) &&
              candidate.total >= 0 &&
              Math.abs(candidate.total) <= Number.MAX_SAFE_INTEGER &&
              candidate.total === candidate.quantity * candidate.unitPrice &&
              validSingleLineLabel(candidate.currencyLabel, MAX_CURRENCY_LABEL_LENGTH)
            );
          }

          export function createSavedEstimatePurchase(
            quantity: number | null,
            unitLabel: string,
            cost: PurchaseCostResult | null,
          ): SavedEstimatePurchase | undefined {
            const normalizedUnit = unitLabel.trim();
            const base: SavedEstimatePurchase = {
              quantity: quantity ?? Number.NaN,
              unitLabel: normalizedUnit,
            };

            if (!isSavedEstimatePurchase(base)) return undefined;
            if (!cost) return base;

            const withCost: SavedEstimatePurchase = {
              ...base,
              unitPrice: cost.unitPrice,
              total: cost.total,
              currencyLabel: cost.currencyLabel,
            };

            if (
              cost.quantity !== base.quantity ||
              cost.unitLabel !== base.unitLabel ||
              !isSavedEstimatePurchase(withCost)
            ) {
              return base;
            }

            return withCost;
          }

          export function parseSavedEstimateHistory(
            serialized: string | null,
          ): SavedEstimate[] {
            if (!serialized) return [];

            try {
              const parsed: unknown = JSON.parse(serialized);

              if (!Array.isArray(parsed)) return [];

              return parsed.filter((item): item is SavedEstimate => {
                if (typeof item !== "object" || item === null) return false;
                const candidate = item as SavedEstimate;
                return (
                  Number.isSafeInteger(candidate.id) &&
                  typeof candidate.label === "string" &&
                  typeof candidate.summary === "string" &&
                  (candidate.purchase === undefined ||
                    isSavedEstimatePurchase(candidate.purchase))
                );
              });
            } catch {
              return [];
            }
          }

          export function addSavedEstimate(
            history: SavedEstimate[],
            estimate: Omit<SavedEstimate, "id">,
            limit = 5,
            timestamp = Date.now(),
          ): SavedEstimate[] {
            const highestExistingId = history.reduce(
              (highest, item) => Math.max(highest, item.id),
              0,
            );
            const id = Math.max(timestamp, highestExistingId + 1);

            return [{ ...estimate, id }, ...history].slice(0, limit);
          }
          '''
          Path("lib/history.ts").write_text(history, encoding="utf-8")

          projects = '''import {
            isSavedEstimatePurchase,
            parseSavedEstimateHistory,
            type SavedEstimatePurchase,
          } from "./history.ts";

          export const PROJECTS_STORAGE_KEY = "buildmeasure.projects.v1";
          export const PROJECT_NAME_MAX_LENGTH = 80;
          export const PROJECT_ITEM_LIMIT = 50;
          export const PROJECT_LIMIT = 10;

          export type ProjectCalculatorId =
            | "concrete"
            | "post-hole-concrete"
            | "paint"
            | "tile"
            | "brick"
            | "gravel"
            | "mulch";

          export type ProjectHistorySource = {
            id: ProjectCalculatorId;
            label: string;
            href: string;
            storageKey: string;
          };

          export const PROJECT_HISTORY_SOURCES: readonly ProjectHistorySource[] = [
            {
              id: "concrete",
              label: "Concrete",
              href: "/concrete-calculator",
              storageKey: "buildmeasure.concrete.history.v1",
            },
            {
              id: "post-hole-concrete",
              label: "Post-hole concrete",
              href: "/post-hole-concrete-calculator",
              storageKey: "buildmeasure.post-hole-concrete.history.v1",
            },
            {
              id: "paint",
              label: "Paint",
              href: "/paint-calculator",
              storageKey: "buildmeasure.paint.history.v1",
            },
            {
              id: "tile",
              label: "Tile",
              href: "/tile-calculator",
              storageKey: "buildmeasure.tile.history.v1",
            },
            {
              id: "brick",
              label: "Brick",
              href: "/brick-calculator",
              storageKey: "buildmeasure.brick.history.v1",
            },
            {
              id: "gravel",
              label: "Gravel",
              href: "/gravel-calculator",
              storageKey: "buildmeasure.gravel.history.v1",
            },
            {
              id: "mulch",
              label: "Mulch",
              href: "/mulch-calculator",
              storageKey: "buildmeasure.mulch.history.v1",
            },
          ];

          export type ProjectEstimate = {
            calculator: ProjectCalculatorId;
            estimateId: number;
            label: string;
            summary: string;
            purchase?: SavedEstimatePurchase;
          };

          export type SavedProject = {
            id: number;
            name: string;
            createdAt: string;
            items: ProjectEstimate[];
          };

          export type ProjectShoppingItem = {
            calculator: ProjectCalculatorId;
            estimateId: number;
            estimateLabel: string;
            quantity: number;
            unitLabel: string;
          };

          export type SerializedProjectHistories = Partial<
            Record<ProjectCalculatorId, string | null>
          >;

          export function getProjectHistorySource(calculator: ProjectCalculatorId) {
            return PROJECT_HISTORY_SOURCES.find((source) => source.id === calculator) ?? null;
          }

          export function projectEstimateKey(item: ProjectEstimate) {
            return `${item.calculator}:${item.estimateId}`;
          }

          function isProjectCalculatorId(value: unknown): value is ProjectCalculatorId {
            return (
              typeof value === "string" &&
              PROJECT_HISTORY_SOURCES.some((source) => source.id === value)
            );
          }

          function isProjectEstimate(value: unknown): value is ProjectEstimate {
            if (typeof value !== "object" || value === null) return false;

            const candidate = value as ProjectEstimate;
            return (
              isProjectCalculatorId(candidate.calculator) &&
              Number.isSafeInteger(candidate.estimateId) &&
              candidate.estimateId > 0 &&
              typeof candidate.label === "string" &&
              candidate.label.length > 0 &&
              typeof candidate.summary === "string" &&
              candidate.summary.length > 0 &&
              (candidate.purchase === undefined ||
                isSavedEstimatePurchase(candidate.purchase))
            );
          }

          function isSavedProject(value: unknown): value is SavedProject {
            if (typeof value !== "object" || value === null) return false;

            const candidate = value as SavedProject;
            return (
              Number.isSafeInteger(candidate.id) &&
              candidate.id > 0 &&
              typeof candidate.name === "string" &&
              candidate.name.trim().length > 0 &&
              candidate.name.length <= PROJECT_NAME_MAX_LENGTH &&
              typeof candidate.createdAt === "string" &&
              Number.isFinite(Date.parse(candidate.createdAt)) &&
              Array.isArray(candidate.items) &&
              candidate.items.length > 0 &&
              candidate.items.length <= PROJECT_ITEM_LIMIT &&
              candidate.items.every(isProjectEstimate)
            );
          }

          export function parseSavedProjects(serialized: string | null): SavedProject[] {
            if (!serialized) return [];

            try {
              const parsed: unknown = JSON.parse(serialized);
              if (!Array.isArray(parsed)) return [];
              return parsed.filter(isSavedProject).slice(0, PROJECT_LIMIT);
            } catch {
              return [];
            }
          }

          export function collectAvailableProjectEstimates(
            histories: SerializedProjectHistories,
          ): ProjectEstimate[] {
            return PROJECT_HISTORY_SOURCES.flatMap((source) =>
              parseSavedEstimateHistory(histories[source.id] ?? null).map((estimate) => ({
                calculator: source.id,
                estimateId: estimate.id,
                label: estimate.label,
                summary: estimate.summary,
                ...(estimate.purchase ? { purchase: estimate.purchase } : {}),
              })),
            ).sort((a, b) => b.estimateId - a.estimateId);
          }

          export function addSavedProject(
            projects: SavedProject[],
            name: string,
            items: ProjectEstimate[],
            limit = PROJECT_LIMIT,
            timestamp = Date.now(),
          ): SavedProject[] {
            const trimmedName = name.trim();
            if (!trimmedName) throw new Error("Project name is required.");
            if (trimmedName.length > PROJECT_NAME_MAX_LENGTH) {
              throw new Error(`Project name must be ${PROJECT_NAME_MAX_LENGTH} characters or fewer.`);
            }

            const uniqueItems = Array.from(
              new Map(items.filter(isProjectEstimate).map((item) => [projectEstimateKey(item), item])).values(),
            ).slice(0, PROJECT_ITEM_LIMIT);
            if (!uniqueItems.length) throw new Error("Select at least one saved estimate.");

            const highestExistingId = projects.reduce(
              (highest, project) => Math.max(highest, project.id),
              0,
            );
            const id = Math.max(timestamp, highestExistingId + 1);
            const createdAt = new Date(timestamp).toISOString();

            return [
              {
                id,
                name: trimmedName,
                createdAt,
                items: uniqueItems,
              },
              ...projects,
            ].slice(0, Math.max(1, limit));
          }

          export function removeSavedProject(projects: SavedProject[], projectId: number) {
            return projects.filter((project) => project.id !== projectId);
          }

          export function buildProjectShoppingList(
            project: Pick<SavedProject, "items">,
          ): ProjectShoppingItem[] {
            return project.items.flatMap((item) =>
              item.purchase
                ? [
                    {
                      calculator: item.calculator,
                      estimateId: item.estimateId,
                      estimateLabel: item.label,
                      quantity: item.purchase.quantity,
                      unitLabel: item.purchase.unitLabel,
                    },
                  ]
                : [],
            );
          }

          export function formatSavedProject(project: SavedProject) {
            const lines = project.items.map((item) => {
              const source = getProjectHistorySource(item.calculator);
              return `- ${source?.label ?? item.calculator}: ${item.label} — ${item.summary}`;
            });
            const shopping = buildProjectShoppingList(project).map((item) => {
              const source = getProjectHistorySource(item.calculator);
              return `- ${source?.label ?? item.calculator}: ${item.quantity} × ${item.unitLabel} — ${item.estimateLabel}`;
            });

            return [
              `BuildMeasure project: ${project.name}`,
              `${project.items.length} saved estimate${project.items.length === 1 ? "" : "s"}`,
              "",
              ...lines,
              ...(shopping.length ? ["", "Shopping list", ...shopping] : []),
            ].join("\\n");
          }
          '''
          Path("lib/projects.ts").write_text(projects, encoding="utf-8")

          calculator_files = []
          for path in sorted(Path("app").glob("*-calculator/*.tsx")):
            text = path.read_text(encoding="utf-8")
            if "usePurchaseCost(" in text and "saveEstimate({" in text and "purchaseUnitLabel" in text:
              calculator_files.append(path)

          if len(calculator_files) != 7:
            raise SystemExit(f"Expected 7 cost-enabled calculator files, found {len(calculator_files)}: {calculator_files}")

          for path in calculator_files:
            text = path.read_text(encoding="utf-8")
            import_needle = 'import { useSavedEstimates } from "@/hooks/use-saved-estimates";\n'
            if import_needle not in text:
              raise SystemExit(f"Missing saved-estimate import anchor in {path}")
            if "createSavedEstimatePurchase" not in text:
              text = text.replace(
                import_needle,
                import_needle + 'import { createSavedEstimatePurchase } from "@/lib/history";\n',
                1,
              )

            cost_match = re.search(
              r"const purchaseCost = usePurchaseCost\(\s*(?P<quantity>[^,\n]+),\s*purchaseUnitLabel,\s*\);",
              text,
            )
            if not cost_match:
              raise SystemExit(f"Could not identify purchase quantity in {path}")
            quantity = cost_match.group("quantity").strip()

            save_anchor = '    });\n    setNotice("Estimate saved on this device.");'
            if save_anchor not in text:
              raise SystemExit(f"Missing saveResult anchor in {path}")
            purchase_block = (
              '      purchase: createSavedEstimatePurchase(\n'
              f'        {quantity},\n'
              '        purchaseUnitLabel,\n'
              '        purchaseCost.result,\n'
              '      ),\n'
            )
            if "purchase: createSavedEstimatePurchase(" not in text:
              text = text.replace(save_anchor, purchase_block + save_anchor, 1)

            path.write_text(text, encoding="utf-8")

          mode_path = Path("components/project-mode.tsx")
          mode = mode_path.read_text(encoding="utf-8")
          mode = mode.replace(
            "  addSavedProject,\n",
            "  addSavedProject,\n  buildProjectShoppingList,\n",
            1,
          )
          component = '''
          function ProjectShoppingList({
            project,
            printable = false,
          }: {
            project: SavedProject;
            printable?: boolean;
          }) {
            const items = buildProjectShoppingList(project);
            if (!items.length) return null;

            return (
              <section
                className={printable ? styles.printShopping : styles.shopping}
                aria-label="Shopping list"
              >
                <div className={styles.shoppingHead}>
                  <div>
                    <p className="panel-kicker">Shopping list</p>
                    <h4>Purchase quantities</h4>
                  </div>
                  {!printable ? (
                    <span className={styles.sourceCount}>
                      {items.length} line{items.length === 1 ? "" : "s"}
                    </span>
                  ) : null}
                </div>
                <ul className={styles.shoppingList}>
                  {items.map((item) => {
                    const source = getProjectHistorySource(item.calculator);
                    return (
                      <li key={`${item.calculator}:${item.estimateId}:${item.unitLabel}`}>
                        <span>
                          <strong>{source?.label ?? item.calculator}</strong>
                          <small>{item.estimateLabel}</small>
                        </span>
                        <b>
                          {item.quantity.toLocaleString("en-US")} × {item.unitLabel}
                        </b>
                      </li>
                    );
                  })}
                </ul>
              </section>
            );
          }

          '''
          export_anchor = "export function ProjectMode() {"
          if "function ProjectShoppingList(" not in mode:
            if export_anchor not in mode:
              raise SystemExit("Missing ProjectMode export anchor")
            mode = mode.replace(export_anchor, component + export_anchor, 1)

          old_help = '''              Print one project or use your browser&apos;s print dialog to save it as
              a PDF. The report is created locally from the saved project snapshot.
          '''
          new_help = '''              Print one project or use your browser&apos;s print dialog to save it as
              a PDF. Shopping lists use structured purchase quantities from newly
              saved estimates; older snapshots stay readable and are never parsed
              to invent quantities.
          '''
          if old_help not in mode:
            raise SystemExit("Missing saved-project help anchor")
          mode = mode.replace(old_help, new_help, 1)

          card_anchor = '''                </ul>
                <div className={styles.cardActions}>
          '''
          if card_anchor not in mode:
            raise SystemExit("Missing saved project card anchor")
          mode = mode.replace(
            card_anchor,
            '''                </ul>
                <ProjectShoppingList project={project} />
                <div className={styles.cardActions}>
          ''',
            1,
          )

          print_anchor = '''          </ul>
          <div className={styles.printNote}>
          '''
          if print_anchor not in mode:
            raise SystemExit("Missing printable report anchor")
          mode = mode.replace(
            print_anchor,
            '''          </ul>
          <ProjectShoppingList project={printingProject} printable />
          <div className={styles.printNote}>
          ''',
            1,
          )
          mode_path.write_text(mode, encoding="utf-8")

          css_path = Path("app/projects/projects.module.css")
          css = css_path.read_text(encoding="utf-8")
          shopping_css = '''

          .shopping,
          .printShopping {
            display: grid;
            gap: 10px;
            padding-top: 12px;
            border-top: 1px solid var(--sand-200);
          }

          .shoppingHead {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 12px;
          }

          .shoppingHead h4 {
            margin: 0;
            font-size: 0.88rem;
            letter-spacing: -0.02em;
          }

          .shoppingList {
            display: grid;
            gap: 7px;
            margin: 0;
            padding: 0;
            list-style: none;
          }

          .shoppingList li {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 14px;
            align-items: center;
            padding: 9px 10px;
            border: 1px solid var(--sand-200);
            border-radius: 7px;
            background: var(--white);
          }

          .shoppingList li > span {
            min-width: 0;
            display: grid;
            gap: 2px;
          }

          .shoppingList strong,
          .shoppingList b {
            font-size: 0.74rem;
          }

          .shoppingList small {
            color: var(--ink-500);
            font-size: 0.66rem;
            line-height: 1.45;
            overflow-wrap: anywhere;
          }

          .shoppingList b {
            text-align: right;
            white-space: nowrap;
          }
          '''
          if ".shoppingList {" not in css:
            css = css.replace("\n.empty {", shopping_css + "\n\n.empty {", 1)

          print_css = '''

            .printShopping {
              break-inside: avoid;
              margin-top: 22px;
              padding-top: 14px;
              border-top: 1px solid #cfd6d2;
            }

            .printShopping .shoppingHead h4,
            .printShopping .shoppingList strong,
            .printShopping .shoppingList b,
            .printShopping .shoppingList small {
              color: #161b18;
              font-family: Arial, Helvetica, sans-serif;
            }

            .printShopping .shoppingList li {
              border-color: #d8dedb;
              background: #fff;
            }
          '''
          if ".printShopping .shoppingHead h4" not in css:
            css = css.replace("\n  .printNote {", print_css + "\n\n  .printNote {", 1)

          mobile_anchor = '''  .selectionActions,
  .cardActions,
  .formActions {
          '''
          if mobile_anchor not in css:
            raise SystemExit("Missing mobile action anchor")
          if ".shoppingList li {\n    grid-template-columns: 1fr;" not in css:
            css = css.replace(
              mobile_anchor,
              '''  .shoppingList li {
    grid-template-columns: 1fr;
  }

  .shoppingList b {
    text-align: left;
  }

  .selectionActions,
  .cardActions,
  .formActions {
          ''',
              1,
            )
          css_path.write_text(css, encoding="utf-8")

          privacy_path = Path("app/privacy/page.tsx")
          privacy = privacy_path.read_text(encoding="utf-8")
          privacy_anchor = '''        browser storage. Estimates and projects are not synchronized to an
        account or sent to BuildMeasure.
          '''
          privacy_replacement = '''        browser storage. Newly saved estimates may also keep the calculated
        purchase quantity, purchase-unit label, and any optional local price and
        currency snapshot you entered. Project Mode uses those structured local
        fields for shopping lists instead of reading numbers back from display
        text. Estimates and projects are not synchronized to an account or sent
        to BuildMeasure.
          '''
          if privacy_anchor not in privacy:
            raise SystemExit("Missing privacy anchor")
          privacy = privacy.replace(privacy_anchor, privacy_replacement, 1)
          privacy_path.write_text(privacy, encoding="utf-8")

          roadmap_path = Path("docs/ROADMAP.md")
          roadmap = roadmap_path.read_text(encoding="utf-8")
          if "- [ ] Shopping list." not in roadmap:
            raise SystemExit("Missing Roadmap shopping-list item")
          roadmap = roadmap.replace("- [ ] Shopping list.", "- [x] Shopping list — structured purchase quantities from saved estimates.", 1)
          note_anchor = '''saved estimate snapshot exactly as the user stored it and do not invent totals.
          '''
          note_replacement = '''saved estimate snapshot exactly as the user stored it and do not invent totals.
Shopping lists now use structured purchase quantity and unit fields stored with
new estimates. Older snapshots remain compatible but are not parsed to invent
missing purchase data. Waste/cost roll-up remains a separate future slice.
          '''
          if note_anchor not in roadmap:
            raise SystemExit("Missing Roadmap note anchor")
          roadmap = roadmap.replace(note_anchor, note_replacement, 1)
          roadmap_path.write_text(roadmap, encoding="utf-8")

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          readme_anchor = "- Per-project copy and printable report actions, including browser-based Save as PDF, without server storage or account sync.\n"
          if readme_anchor not in readme:
            raise SystemExit("Missing README Project Mode anchor")
          readme = readme.replace(
            readme_anchor,
            readme_anchor + "- Per-project shopping lists built from structured purchase quantities saved by the calculators; older snapshots are not parsed to invent quantities.\n",
            1,
          )
          readme_path.write_text(readme, encoding="utf-8")

          shopping_test = '''import assert from "node:assert/strict";
          import test from "node:test";
          import {
            createSavedEstimatePurchase,
            parseSavedEstimateHistory,
          } from "../lib/history.ts";
          import {
            buildProjectShoppingList,
            collectAvailableProjectEstimates,
          } from "../lib/projects.ts";

          test("creates validated structured purchase snapshots without parsing display text", () => {
            const purchase = createSavedEstimatePurchase(62, "80 lb bag", {
              quantity: 62,
              unitPrice: 5.5,
              total: 341,
              currencyLabel: "$",
              unitLabel: "80 lb bag",
            });

            assert.deepEqual(purchase, {
              quantity: 62,
              unitLabel: "80 lb bag",
              unitPrice: 5.5,
              total: 341,
              currencyLabel: "$",
            });
            assert.deepEqual(createSavedEstimatePurchase(4, "1 gal can", null), {
              quantity: 4,
              unitLabel: "1 gal can",
            });
            assert.equal(createSavedEstimatePurchase(null, "bag", null), undefined);
          });

          test("keeps legacy histories compatible and rejects malformed structured purchases", () => {
            const parsed = parseSavedEstimateHistory(JSON.stringify([
              { id: 1, label: "Legacy", summary: "10 bags" },
              {
                id: 2,
                label: "Structured",
                summary: "62 bags",
                purchase: { quantity: 62, unitLabel: "80 lb bag" },
              },
              {
                id: 3,
                label: "Bad structured value",
                summary: "bad",
                purchase: { quantity: 1.5, unitLabel: "bag" },
              },
            ]));

            assert.equal(parsed.length, 2);
            assert.equal(parsed[0].purchase, undefined);
            assert.deepEqual(parsed[1].purchase, { quantity: 62, unitLabel: "80 lb bag" });
          });

          test("propagates structured purchase data into project shopping lists only when present", () => {
            const available = collectAvailableProjectEstimates({
              concrete: JSON.stringify([
                {
                  id: 10,
                  label: "Patio slab",
                  summary: "62 × 80 lb bags",
                  purchase: { quantity: 62, unitLabel: "80 lb bag" },
                },
              ]),
              paint: JSON.stringify([
                { id: 11, label: "Legacy room", summary: "2 × 1 gal cans" },
              ]),
            });

            const shopping = buildProjectShoppingList({ items: available });
            assert.deepEqual(shopping, [
              {
                calculator: "concrete",
                estimateId: 10,
                estimateLabel: "Patio slab",
                quantity: 62,
