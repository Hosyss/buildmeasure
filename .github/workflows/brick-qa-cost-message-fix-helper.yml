name: Align Brick QA cost validation message

on:
  push:
    branches:
      - feature/brick-calculator

permissions:
  contents: write

jobs:
  patch-and-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Align temporary QA assertion with shared validator copy
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/brick-browser-qa.mjs')
          text = path.read_text()
          old = 'assert.match(current.costError, /cannot be negative/i);'
          new = 'assert.match(current.costError, /zero or greater/i);'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one old cost assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          git rm -f .github/workflows/brick-qa-cost-message-fix-helper.yml
          git rm -f .brick-qa-retry-trigger-4 || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/brick-browser-qa.mjs
          git commit -m 'Align temporary Brick cost validation QA'
          git push origin HEAD:feature/brick-calculator
