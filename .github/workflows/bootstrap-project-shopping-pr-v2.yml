name: Bootstrap project shopping list PR v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feature/project-shopping-list'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/project-shopping-list
          fetch-depth: 2

      - name: Apply corrected bootstrap patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re
          import subprocess

          workflow = Path('.github/workflows/bootstrap-project-shopping.yml').read_text(encoding='utf-8')
          start_marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY\n\n          git diff --check"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          raw = workflow[start:end]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in raw.splitlines()
          ) + "\n"

          script = script.replace(
              'if "usePurchaseCost(" in text and "saveEstimate({" in text and "purchaseUnitLabel" in text:',
              'if "usePurchaseCost(" in text and "saveEstimate({" in text:',
          )
          script = script.replace(
              'r"const purchaseCost = usePurchaseCost\\(\\s*(?P<quantity>[^,\\n]+),\\s*purchaseUnitLabel,\\s*\\);",',
              'r"const purchaseCost = usePurchaseCost\\(\\s*(?P<quantity>[^,\\n]+),\\s*(?P<unit>[^,\\n]+),\\s*\\);",',
          )
          script = script.replace(
              '            quantity = cost_match.group("quantity").strip()\n\n            save_anchor',
              '            quantity = cost_match.group("quantity").strip()\n            unit_label = cost_match.group("unit").strip()\n\n            save_anchor',
          )
          script = script.replace(
              "              '        purchaseUnitLabel,\\n'\n",
              "              f'        {unit_label},\\n'\n",
          )

          replacement = '''          old_help = "Print one project or use your browser&apos;s print dialog to save it as\\n              a PDF. The report is created locally from the saved project snapshot."
          new_help = "Print one project or use your browser&apos;s print dialog to save it as\\n              a PDF. Shopping lists use structured purchase quantities from newly\\n              saved estimates; older snapshots stay readable and are never parsed\\n              to invent quantities."
          if old_help not in mode:
            raise SystemExit("Missing saved-project help anchor")
          mode = mode.replace(old_help, new_help, 1)
'''
          script, count = re.subn(
              r"          old_help = '''[\s\S]*?          mode = mode\.replace\(old_help, new_help, 1\)\n",
              lambda _: replacement,
              script,
              count=1,
          )
          if count != 1:
              raise SystemExit('Could not rewrite saved-project help block')

          Path('/tmp/project-shopping-bootstrap.py').write_text(script, encoding='utf-8')
          subprocess.run(['python3', '/tmp/project-shopping-bootstrap.py'], check=True)
          PY

          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app components docs lib tests README.md
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "Add structured Project Mode shopping lists"
          git push origin HEAD:feature/project-shopping-list
