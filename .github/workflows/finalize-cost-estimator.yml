name: Finalize cost estimator audit

on:
  push:
    branches:
      - feature/cost-estimator

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'Finalize cost estimator audit and QA cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/cost-estimator
          fetch-depth: 0

      - name: Append permanent audit evidence
        run: node scripts/finalize-cost-audit.mjs

      - name: Remove temporary milestone QA plumbing and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/cost-estimator-milestone-qa.yml
          rm -f .github/workflows/finalize-cost-estimator.yml
          rm -f scripts/qa-preview-server.mjs
          rm -f scripts/cost-browser-qa.mjs
          rm -f scripts/cost-browser-qa-v2.mjs
          rm -f scripts/finalize-cost-audit.mjs
          rm -f docs/.cost-estimator-qa-trigger

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record cost estimator audit and remove temporary QA"
          git push origin HEAD:feature/cost-estimator
