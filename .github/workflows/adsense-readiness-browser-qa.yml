name: AdSense readiness browser QA

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-qa:
    if: github.head_ref == 'maintenance/adsense-readiness-2026-08-22'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build production app
        run: npm run build

      - name: Install temporary Playwright harness
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps firefox webkit

      - name: Create temporary browser test
        shell: bash
        run: |
          cat > playwright.adsense.config.mjs <<'EOF'
          import { defineConfig } from "@playwright/test";

          const sizes = [
            [360, 800],
            [768, 900],
            [1280, 900],
          ];

          export default defineConfig({
            testDir: ".tmp-adsense-tests",
            timeout: 30_000,
            workers: 1,
            reporter: "line",
            use: { baseURL: "http://127.0.0.1:4173" },
            projects: ["firefox", "webkit"].flatMap((browserName) =>
              sizes.map(([width, height]) => ({
                name: `${browserName}-${width}x${height}`,
                use: { browserName, viewport: { width, height } },
              })),
            ),
          });
          EOF

          mkdir -p .tmp-adsense-tests
          cat > .tmp-adsense-tests/adsense-readiness.spec.mjs <<'EOF'
          import { expect, test } from "@playwright/test";

          test("keeps public trust and AdSense verification surfaces ready", async ({ page, request }) => {
            const errors = [];
            page.on("pageerror", (error) => errors.push(`pageerror: ${error.message}`));
            page.on("console", (message) => {
              if (message.type() === "error") errors.push(`console: ${message.text()}`);
            });

            const assertNoOverflow = async () => {
              const overflow = await page.evaluate(() =>
                document.documentElement.scrollWidth > document.documentElement.clientWidth,
              );
              expect(overflow).toBe(false);
            };

            const home = await page.goto("/");
            expect(home?.status()).toBe(200);
            await expect(page.getByRole("heading", { name: "Material estimates you can build on." })).toBeVisible();
            await expect(page.locator('meta[name="google-adsense-account"]')).toHaveAttribute(
              "content",
              "ca-pub-3369551572403499",
            );
            await expect(page.locator('script[src*="pagead2.googlesyndication.com/pagead/js/adsbygoogle.js"]')).toHaveCount(0);
            await expect(page.getByRole("link", { name: "About", exact: true }).last()).toBeVisible();
            await expect(page.getByRole("link", { name: "Contact", exact: true }).last()).toBeVisible();
            await expect(page.getByRole("link", { name: "Privacy", exact: true }).last()).toBeVisible();
            await expect(page.getByRole("link", { name: "Terms", exact: true }).last()).toBeVisible();
            await assertNoOverflow();

            const contact = await page.goto("/contact");
            expect(contact?.status()).toBe(200);
            await expect(page.getByRole("heading", { name: "Get in touch with BuildMeasure" })).toBeVisible();
            await expect(page.getByRole("heading", { name: "Calculator accuracy or usability" })).toBeVisible();
            await expect(page.getByRole("heading", { name: "Privacy or data request" })).toBeVisible();
            await assertNoOverflow();

            const privacy = await page.goto("/privacy");
            expect(privacy?.status()).toBe(200);
            await expect(page.getByRole("heading", { name: "Advertising and Google AdSense" })).toBeVisible();
            await expect(page.getByRole("link", { name: "Google Ads Settings" })).toHaveAttribute(
              "href",
              "https://adssettings.google.com/",
            );
            await expect(page.getByText("Google-certified consent management platform", { exact: false })).toBeVisible();
            await assertNoOverflow();

            const adsTxt = await request.get("/ads.txt");
            expect(adsTxt.status()).toBe(200);
            expect((await adsTxt.text()).trim()).toBe(
              "google.com, pub-3369551572403499, DIRECT, f08c47fec0942fa0",
            );

            const sitemap = await request.get("/sitemap.xml");
            expect(sitemap.status()).toBe(200);
            const sitemapText = await sitemap.text();
            expect(sitemapText).toContain("https://buildmeasure.buildtools.workers.dev/contact");
            expect(sitemapText).toContain("https://buildmeasure.buildtools.workers.dev/privacy");

            expect(errors).toEqual([]);
          });
          EOF

      - name: Start production server
        shell: bash
        run: |
          PORT=4173 npm run start > /tmp/buildmeasure-adsense-qa-server.log 2>&1 &
          echo $! > /tmp/buildmeasure-adsense-qa-server.pid
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/buildmeasure-adsense-qa-server.log
          exit 1

      - name: Run Firefox and WebKit AdSense readiness QA
        run: npx playwright test --config=playwright.adsense.config.mjs

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/buildmeasure-adsense-qa-server.log || true
