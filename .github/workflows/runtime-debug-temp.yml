name: Temporary runtime probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start local preview
        run: |
          npm start -- --port 4173 --hostname 127.0.0.1 >/tmp/buildmeasure-server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/buildmeasure-server.log
          exit 1
      - name: Capture browser analytics request
        run: |
          mkdir -p /tmp/browser-probe
          cd /tmp/browser-probe
          npm init -y >/dev/null
          npm install playwright-core@1.55.0 >/dev/null
          cat > probe.mjs <<'EOF'
          import { chromium } from 'playwright-core';
          const browser = await chromium.launch({ headless: true, executablePath: '/usr/bin/google-chrome' });
          const context = await browser.newContext({ viewport: { width: 360, height: 800 } });
          const page = await context.newPage();
          const analytics = [];
          const clarityRequests = [];
          page.on('request', request => {
            if (request.url().includes('/api/analytics')) {
              analytics.push({ method: request.method(), url: request.url(), postData: request.postData(), headers: request.headers() });
            }
            if (/clarity\.ms|c\.bing\.com/.test(request.url())) clarityRequests.push(request.url());
          });
          page.on('response', async response => {
            if (!response.url().includes('/api/analytics')) return;
            let body = '';
            try { body = await response.text(); } catch {}
            console.log('ANALYTICS_RESPONSE', JSON.stringify({ status: response.status(), body }));
          });
          await page.goto('http://127.0.0.1:4173/concrete-calculator', { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(1500);
          console.log('ANALYTICS_REQUESTS', JSON.stringify(analytics));
          console.log('CLARITY_BEFORE_CONSENT', JSON.stringify(clarityRequests));
          await browser.close();
          EOF
          node probe.mjs
      - name: Probe production health read-only
        run: |
          production='https://buildmeasuretools.pages.dev'
          for path in /api/health /status; do
            printf '\n--- %s%s ---\n' "$production" "$path"
            curl -sS --max-redirs 0 -D - -o /tmp/production-body.txt "$production$path" || true
            head -c 1200 /tmp/production-body.txt || true
            printf '\n'
          done
      - name: Probe complete
        run: echo 'Read-only runtime probes completed; no production events were sent.'
