name: Cost estimator milestone QA

on:
  push:
    branches:
      - feature/cost-estimator

permissions:
  contents: read

concurrency:
  group: cost-estimator-milestone-qa
  cancel-in-progress: true

jobs:
  milestone-qa:
    if: github.event.head_commit.message == 'Run cost estimator milestone QA'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Re-run complete automated quality gate
        run: npm run qa:automated

      - name: Block high-risk production dependency advisories
        run: npm audit --omit=dev --audit-level=high

      - name: Start local production Worker preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts lighthouse-results
          node scripts/qa-preview-server.mjs > qa-artifacts/preview-server.log 2>&1 &
          echo $! > /tmp/buildmeasure-qa-preview.pid

          ready=0
          for _ in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/concrete-calculator >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done

          if [[ "$ready" != "1" ]]; then
            cat qa-artifacts/preview-server.log
            exit 1
          fi

      - name: Run supervised browser interaction matrix
        run: node scripts/cost-browser-qa-v2.mjs

      - name: Run Lighthouse milestone matrix
        shell: bash
        run: |
          set -euo pipefail

          lighthouse_version="$(npx --yes lighthouse --version)"
          echo "Lighthouse ${lighthouse_version}" | tee qa-artifacts/lighthouse-version.txt

          # Prime the hosted browser/toolchain. These warm-up reports are not scored
          # or retained as release evidence; the >=95 threshold is unchanged.
          for warmup in 1 2; do
            echo "Lighthouse warm-up ${warmup}/2 (not scored)"
            npx --yes lighthouse "http://127.0.0.1:4173/" \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
              --only-categories=performance \
              --output=json \
              --output-path="/tmp/buildmeasure-cost-lighthouse-warmup-${warmup}.json" \
              --quiet
          done

          routes=(
            "/"
            "/concrete-calculator"
            "/post-hole-concrete-calculator"
            "/paint-calculator"
            "/tile-calculator"
            "/gravel-calculator"
            "/mulch-calculator"
          )

          for profile in mobile desktop; do
            preset=()
            if [[ "$profile" == "desktop" ]]; then
              preset=(--preset=desktop)
            fi

            for route in "${routes[@]}"; do
              slug="${route#/}"
              if [[ -z "$slug" ]]; then
                slug="home"
              fi
              report="lighthouse-results/${slug}-${profile}.json"
              echo "Auditing ${route} (${profile})"
              npx --yes lighthouse "http://127.0.0.1:4173${route}" \
                "${preset[@]}" \
                --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
                --only-categories=performance,accessibility,best-practices,seo \
                --output=json \
                --output-path="$report" \
                --quiet
            done
          done

          node --input-type=module <<'NODE'
          import { readdir, readFile, writeFile } from "node:fs/promises";

          const directory = "lighthouse-results";
          const files = (await readdir(directory)).filter((name) => name.endsWith(".json")).sort();
          const categories = ["performance", "accessibility", "best-practices", "seo"];
          const summary = [];
          let failed = false;

          for (const file of files) {
            const report = JSON.parse(await readFile(`${directory}/${file}`, "utf8"));
            const scores = Object.fromEntries(
              categories.map((name) => [name, Math.round((report.categories[name]?.score ?? 0) * 100)]),
            );
            summary.push({ file, scores });
            console.log(`${file}: ${JSON.stringify(scores)}`);
            if (Object.values(scores).some((score) => score < 95)) failed = true;
          }

          if (files.length !== 14) {
            console.error(`Expected 14 Lighthouse reports, found ${files.length}.`);
            failed = true;
          }

          await writeFile("qa-artifacts/lighthouse-summary.json", `${JSON.stringify(summary, null, 2)}\n`);
          if (failed) process.exit(1);
          NODE

      - name: Stop local preview
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/buildmeasure-qa-preview.pid ]]; then
            kill "$(cat /tmp/buildmeasure-qa-preview.pid)" >/dev/null 2>&1 || true
          fi

      - name: Upload cost estimator QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cost-estimator-milestone-qa
          path: |
            qa-artifacts
            lighthouse-results
          if-no-files-found: warn
          retention-days: 7
