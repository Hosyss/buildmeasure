name: Temporary focused production UX smoke

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  production-smoke:
    name: Focused production UX verification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Verify Cloudflare has the merged UX
        shell: bash
        run: |
          set -euo pipefail
          base="https://buildmeasure.buildtools.workers.dev"
          home="$(curl -fsSL --max-time 25 "$base/")"
          brick="$(curl -fsSL --max-time 25 "$base/brick-calculator")"
          guide="$(curl -fsSL --max-time 25 "$base/guides/how-many-bricks-do-i-need")"
          grep -Fq 'Example estimate' <<<"$home" || { echo '::error::Merged homepage UX marker is missing from production'; exit 1; }
          grep -Fq 'brick-rate-output' <<<"$brick" || { echo '::error::Merged Brick static-output marker is missing from production'; exit 1; }
          grep -Fq 'Open Brick Calculator' <<<"$guide" || { echo '::error::Merged Brick guide CTA marker is missing from production'; exit 1; }
          echo 'Merged PR #33 UX markers are present on Cloudflare production.'

      - name: Verify production routes and APIs
        shell: bash
        run: |
          set -euo pipefail
          base="https://buildmeasure.buildtools.workers.dev"
          paths=(
            /
            /brick-calculator
            /concrete-calculator
            /post-hole-concrete-calculator
            /paint-calculator
            /tile-calculator
            /gravel-calculator
            /mulch-calculator
            /guides/how-many-bricks-do-i-need
            /guides/how-many-bags-of-concrete
            /guides/how-many-bags-of-concrete-for-post-holes
            /guides/how-much-paint-do-i-need
            /guides/how-many-tiles-do-i-need
            /guides/how-much-gravel-do-i-need
            /guides/how-much-mulch-do-i-need
            /api/health
            /status
            /robots.txt
            /sitemap.xml
            /llms.txt
          )
          for path in "${paths[@]}"; do
            code="$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 25 "$base$path")"
            echo "$path -> $code"
            if [ "$code" != "200" ]; then
              echo "::error title=Production route failed::$path returned HTTP $code"
              exit 1
            fi
          done

      - name: Install browser driver only for the temporary smoke
        run: npm install --no-save --ignore-scripts puppeteer-core@24.16.0

      - name: Verify responsive production browser behavior
        shell: bash
        run: |
          set -u
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          cat > /tmp/focused-production-smoke.mjs <<'NODE'
          import puppeteer from 'puppeteer-core';

          const base = 'https://buildmeasure.buildtools.workers.dev';
          const failures = [];
          const browser = await puppeteer.launch({
            executablePath: process.env.CHROME_BIN,
            headless: true,
            args: ['--no-sandbox', '--disable-dev-shm-usage'],
          });

          const check = (condition, message) => { if (!condition) failures.push(message); };
          const viewports = [
            { width: 360, height: 900 },
            { width: 768, height: 1024 },
            { width: 1280, height: 900 },
          ];

          for (const viewport of viewports) {
            for (const route of ['/', '/brick-calculator', '/guides/how-many-bricks-do-i-need']) {
              const page = await browser.newPage();
              await page.setViewport(viewport);
              const response = await page.goto(base + route, { waitUntil: 'domcontentloaded', timeout: 45000 });
              check(response?.status() === 200, `${route} at ${viewport.width}px returned ${response?.status()}`);
              await new Promise((resolve) => setTimeout(resolve, 800));

              const layout = await page.evaluate(() => ({
                innerWidth: window.innerWidth,
                scrollWidth: document.documentElement.scrollWidth,
              }));
              check(layout.scrollWidth <= layout.innerWidth + 1, `${route} horizontally overflows at ${viewport.width}px (${layout.scrollWidth} > ${layout.innerWidth})`);

              if (route === '/') {
                const state = await page.evaluate(() => {
                  const card = document.querySelector('.estimate-card-link');
                  return {
                    example: document.body.textContent?.includes('Example estimate') ?? false,
                    cardHref: card?.getAttribute('href'),
                    fakeControls: card?.querySelectorAll('input,select,button').length ?? -1,
                    browse: [...document.querySelectorAll('a')].some((a) => a.textContent?.trim() === 'Browse calculators' && a.getAttribute('href') === '/#calculators'),
                  };
                });
                check(state.example, `homepage missing Example estimate at ${viewport.width}px`);
                check(state.cardHref === '/concrete-calculator', `homepage example href is ${state.cardHref} at ${viewport.width}px`);
                check(state.fakeControls === 0, `homepage example has ${state.fakeControls} fake controls at ${viewport.width}px`);
                check(state.browse, `homepage Browse calculators CTA missing at ${viewport.width}px`);
              }

              if (route === '/brick-calculator') {
                const initial = await page.evaluate(() => ({
                  output: document.querySelector('#brick-rate-output')?.textContent ?? '',
                  custom: Boolean(document.querySelector('#brick-custom-coverage-rate')),
                  all: [...document.querySelectorAll('a')].some((a) => a.textContent?.trim() === 'All calculators' && a.getAttribute('href') === '/#calculators'),
                }));
                check(initial.output.includes('100 ft²'), `Brick preset output lacks 100 ft² at ${viewport.width}px: ${initial.output}`);
                check(!initial.custom, `Brick Custom input is visible before Custom selection at ${viewport.width}px`);
                check(initial.all, `Brick All calculators CTA missing at ${viewport.width}px`);

                await page.evaluate(() => {
                  const metric = [...document.querySelectorAll('button')].find((button) => button.textContent?.includes('Metric'));
                  metric?.click();
                });
                await new Promise((resolve) => setTimeout(resolve, 200));
                const metricText = await page.$eval('#brick-rate-output', (node) => node.textContent ?? '');
                check(metricText.includes('10 m²'), `Brick Metric output lacks 10 m² at ${viewport.width}px: ${metricText}`);

                await page.evaluate(() => {
                  const select = [...document.querySelectorAll('select')].find((item) => [...item.options].some((option) => option.value === 'custom'));
                  if (!select) return;
                  select.value = 'custom';
                  select.dispatchEvent(new Event('change', { bubbles: true }));
                });
                await new Promise((resolve) => setTimeout(resolve, 200));
                check(Boolean(await page.$('#brick-custom-coverage-rate')), `Brick Custom input did not appear at ${viewport.width}px`);
                check(!(await page.$('#brick-rate-output')), `Brick preset output remained in Custom mode at ${viewport.width}px`);
              }

              if (route === '/guides/how-many-bricks-do-i-need') {
                const state = await page.evaluate(() => ({
                  header: [...document.querySelectorAll('a')].some((a) => a.textContent?.trim() === 'Open Brick Calculator' && a.getAttribute('href') === '/brick-calculator'),
                  primary: [...document.querySelectorAll('a')].some((a) => a.textContent?.trim() === 'Calculate my brick wall' && a.getAttribute('href') === '/brick-calculator'),
                }));
                check(state.header, `Brick guide header CTA missing at ${viewport.width}px`);
                check(state.primary, `Brick guide primary CTA missing at ${viewport.width}px`);
              }

              await page.close();
              console.log(`PASS ${route} ${viewport.width}x${viewport.height}`);
            }
          }

          await browser.close();
          if (failures.length) {
            await import('node:fs').then(({ writeFileSync }) => writeFileSync('/tmp/focused-failures.txt', failures.join(' | ')));
            process.exit(1);
          }
          console.log('Focused responsive production browser smoke passed.');
          NODE

          CHROME_BIN="$chrome" node /tmp/focused-production-smoke.mjs
          status=$?
          if [ "$status" -ne 0 ]; then
            detail="$(cat /tmp/focused-failures.txt 2>/dev/null || echo 'Browser script failed before assertions completed')"
            safe="${detail//'%'/'%25'}"
            safe="${safe//$'\n'/'%0A'}"
            safe="${safe//$'\r'/'%0D'}"
            echo "::error title=Focused production browser smoke::$safe"
            exit "$status"
          fi

      - name: Verify critical production links
        shell: bash
        run: |
          set -euo pipefail
          base="https://buildmeasure.buildtools.workers.dev"
          links=(
            /concrete-calculator
            /#calculators
            /brick-calculator
            /guides/how-many-bricks-do-i-need
          )
          for href in "${links[@]}"; do
            path="${href%%#*}"
            [ -n "$path" ] || path=/
            code="$(curl -sS -o /tmp/link-body -w '%{http_code}' --max-time 25 "$base$path")"
            echo "$href -> $code"
            if [ "$code" != "200" ]; then
              echo "::error title=Critical production link failed::$href returned HTTP $code"
              exit 1
            fi
          done

      - name: Record focused smoke summary
        run: |
          {
            echo '## Focused production verification passed'
            echo '- PR #33 UX markers are live on Cloudflare production.'
            echo '- All seven calculators, seven focused guides, API health/status, robots, sitemap, and llms returned HTTP 200.'
            echo '- Homepage, Brick, and Brick guide passed browser checks at 360×900, 768×1024, and 1280×900.'
            echo '- Brick Imperial → Metric → Custom interaction passed on production.'
            echo '- No horizontal overflow was detected on the three directly affected production surfaces.'
            echo '- Critical internal destinations returned HTTP 200.'
          } >> "$GITHUB_STEP_SUMMARY"
