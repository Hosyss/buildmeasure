name: BuildMeasure quality gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buildmeasure-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run the complete quality gate
        run: npm run qa:automated

      - name: Block high-risk production dependency advisories
        run: npm audit --omit=dev --audit-level=high

      - name: Run production-brand Lighthouse milestone matrix
        if: github.event_name == 'pull_request' && github.head_ref == 'hardening/production-brand-identity'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p lighthouse-results
          node scripts/qa-preview-server.mjs > /tmp/buildmeasure-qa-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" >/dev/null 2>&1 || true' EXIT

          ready=0
          for _ in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done

          if [[ "$ready" != "1" ]]; then
            cat /tmp/buildmeasure-qa-preview.log
            exit 1
          fi

          lighthouse_version="$(npx --yes lighthouse --version)"
          echo "Lighthouse ${lighthouse_version}"

          for warmup in 1 2; do
            echo "Lighthouse warm-up ${warmup}/2 (not scored)"
            npx --yes lighthouse "http://127.0.0.1:4173/" \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
              --only-categories=performance \
              --output=json \
              --output-path="/tmp/buildmeasure-lighthouse-warmup-${warmup}.json" \
              --quiet
          done

          routes=(
            "/"
            "/concrete-calculator"
            "/post-hole-concrete-calculator"
            "/paint-calculator"
            "/tile-calculator"
            "/gravel-calculator"
            "/mulch-calculator"
          )

          for profile in mobile desktop; do
            preset=()
            if [[ "$profile" == "desktop" ]]; then
              preset=(--preset=desktop)
            fi

            for route in "${routes[@]}"; do
              slug="${route#/}"
              if [[ -z "$slug" ]]; then
                slug="home"
              fi
              report="lighthouse-results/${slug}-${profile}.json"
              echo "Auditing ${route} (${profile})"
              npx --yes lighthouse "http://127.0.0.1:4173${route}" \
                "${preset[@]}" \
                --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
                --only-categories=performance,accessibility,best-practices,seo \
                --output=json \
                --output-path="$report" \
                --quiet
            done
          done

          node --input-type=module <<'NODE'
          import { readdir, readFile } from "node:fs/promises";

          const directory = "lighthouse-results";
          const files = (await readdir(directory)).filter((name) => name.endsWith(".json")).sort();
          const categories = ["performance", "accessibility", "best-practices", "seo"];
          let failed = false;

          for (const file of files) {
            const report = JSON.parse(await readFile(`${directory}/${file}`, "utf8"));
            const scores = Object.fromEntries(
              categories.map((name) => [name, Math.round((report.categories[name]?.score ?? 0) * 100)]),
            );
            console.log(`${file}: ${JSON.stringify(scores)}`);
            if (Object.values(scores).some((score) => score < 95)) failed = true;
          }

          if (files.length !== 14) {
            console.error(`Expected 14 Lighthouse reports, found ${files.length}.`);
            failed = true;
          }

          if (failed) process.exit(1);
          NODE

      - name: Upload production-brand Lighthouse reports
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'hardening/production-brand-identity'
        uses: actions/upload-artifact@v4
        with:
          name: production-brand-lighthouse-reports
          path: lighthouse-results
          if-no-files-found: warn
          retention-days: 7
