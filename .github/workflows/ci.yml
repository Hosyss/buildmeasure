name: BuildMeasure quality gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: buildmeasure-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run the complete quality gate
        run: npm run qa:automated

      - name: Block high-risk production dependency advisories
        run: npm audit --omit=dev --audit-level=high

  finalize-brand-audit:
    name: Append brand audit evidence and restore CI
    if: github.event_name == 'pull_request' && github.head_ref == 'hardening/production-brand-identity'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: hardening/production-brand-identity
          fetch-depth: 0

      - name: Append permanent audit record and restore normal CI
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main

          cat >> docs/AUDITS.md <<'EOF'

